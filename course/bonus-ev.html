<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bonus dars. Elektr yuritma moylari — OilBook taʼlimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: учебник с боковым оглавлением уроков слева и колонкой чтения ~68ch справа; медь = ключевая тема курса (обмотки), петроль-зелёный = масло/структура */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E4EAE8; --ink:#14201E; --muted:#56635F; --line:#D2DBD8;
  --copper:#A9531F; --copper-soft:#F6E5D9; --teal:#0D5B57; --teal-soft:#DCEDEA;
  --good:#1D7A45; --good-soft:#DDF1E4; --bad:#B3261E; --bad-soft:#F9DEDB;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1312; --surface:#131C1B; --sunk:#0F1716; --ink:#E3EBE8; --muted:#94A39F; --line:#25312F;
  --copper:#E58B54; --copper-soft:#3A2418; --teal:#5BBDB4; --teal-soft:#14302D;
  --good:#5CCB8A; --good-soft:#15301F; --bad:#F2867D; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#131C1B; --sunk:#0F1716; --ink:#E3EBE8; --muted:#94A39F; --line:#25312F;
  --copper:#E58B54; --copper-soft:#3A2418; --teal:#5BBDB4; --teal-soft:#14302D;
  --good:#5CCB8A; --good-soft:#15301F; --bad:#F2867D; --bad-soft:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:4px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.02em;line-height:1.2}
.brand-name small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:120px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--copper);width:0;transition:width .4s}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}

.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.side h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px;font-weight:600}
.nav{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:2px}
.nav a{display:grid;grid-template-columns:28px minmax(0,1fr) 14px;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--teal-soft)}
.nav .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav a.on .num{color:var(--teal)}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.dot.done{background:var(--copper);border-color:var(--copper)}

main{min-width:0}
.page{max-width:760px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);font-weight:600;margin:0 0 10px}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,44px);line-height:1.12;margin:0 0 18px}
h2{font-size:clamp(22px,3vw,30px);line-height:1.2;margin:0 0 14px}
h3{font-size:19px;line-height:1.3;margin:38px 0 10px;font-weight:700;text-wrap:balance}
h3 .sec{font-family:var(--mono);font-size:13px;color:var(--copper);font-weight:600;margin-right:8px}
p{margin:0 0 14px}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
ul.list,ol.list{margin:0 0 16px;padding-left:22px}
ul.list li,ol.list li{margin-bottom:6px}
strong{font-weight:650}
code,.mono{font-family:var(--mono);font-size:.88em}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:0 0 26px}
.meta b{color:var(--ink);font-weight:600}

.tbl{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:none}
td.n{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}

.note{border-left:3px solid var(--teal);background:var(--teal-soft);padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0}
.note.biz{border-color:var(--copper);background:var(--copper-soft)}
.note.warn{border-color:var(--bad);background:var(--bad-soft)}
.note .tag{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:4px;color:var(--teal)}
.note.biz .tag{color:var(--copper)}
.note.warn .tag{color:var(--bad)}
.note p:last-child,.note ul:last-child{margin-bottom:0}

.fig{margin:10px 0 24px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px}
.fig svg{display:block;width:100%;min-width:540px;height:auto}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:8px}
svg .bx{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
svg .bx-hl{fill:var(--copper-soft);stroke:var(--copper);stroke-width:1.5}
svg .bx-t{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
svg .t{fill:var(--ink);font-family:var(--body);font-size:14px;font-weight:600}
svg .ts{fill:var(--muted);font-family:var(--body);font-size:12px}
svg .tc{fill:var(--copper);font-family:var(--body);font-size:12.5px;font-weight:600}
svg .tt{fill:var(--teal);font-family:var(--body);font-size:12.5px;font-weight:600}
svg .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .ln-c{stroke:var(--copper);stroke-width:2.2;fill:none;stroke-dasharray:6 5}
svg .ln-t{stroke:var(--teal);stroke-width:2;fill:none}
svg .ar{fill:var(--muted)}
svg .ar-c{fill:var(--copper)}
svg .ar-t{fill:var(--teal)}

/* models reference */
.wide{max-width:1000px}
.lvl{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap}
.lvl.a{background:var(--good-soft);color:var(--good)}
.lvl.b{background:var(--teal-soft);color:var(--teal)}
.lvl.c{background:var(--bad-soft);color:var(--bad)}
.tbl.models table{min-width:860px}
.tbl.models td:first-child{min-width:150px}
td .src{display:block;font-size:12px;margin-top:4px}

/* catalog filter */
.flt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.flt button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.flt button:hover{border-color:var(--teal)}
.flt button.on{background:var(--teal);color:var(--surface);border-color:var(--teal)}
.tbl.models.cat table{min-width:1000px}

.nav .modh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);font-weight:700;padding:12px 10px 4px}

.lang{font-size:13px;font-weight:600;text-decoration:none;color:var(--teal);border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap}
.lang:hover{border-color:var(--teal)}

/* hero */
.hero{padding:10px 0 8px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:26px 0 30px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fact b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;color:var(--teal)}
.fact span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:var(--surface);border:none;border-radius:9px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 26px}
.toc a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.35}
.toc a:hover{border-color:var(--teal)}
.toc .num{font-family:var(--mono);color:var(--copper);font-size:13px;padding-top:1px}
.toc small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}

/* quiz */
.quiz{margin-top:44px;border-top:2px solid var(--ink);padding-top:22px}
.quiz-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.quiz-head h2{margin:0}
.quiz-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;margin-top:14px}
.q-t{font-weight:600;margin:0 0 12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px}
.q-t .num{font-family:var(--mono);color:var(--copper);font-size:13px;padding-top:3px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;line-height:1.45;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.ok::before{content:"Toʻgʻri · ";font-weight:700;color:var(--good)}
.opt.no::before{content:"Notoʻgʻri · ";font-weight:700;color:var(--bad)}
.why{margin:12px 0 2px;font-size:14.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.result{margin-top:18px;padding:18px 20px;border-radius:12px;background:var(--teal-soft);border:1px solid var(--teal)}
.result b{font-family:var(--display);font-size:22px}
.result.fail{background:var(--bad-soft);border-color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1 1 220px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:14.5px;line-height:1.35}
.pager a:hover{border-color:var(--teal)}
.pager a small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.pager a.next{text-align:right}
.cert{margin-top:16px;padding:22px;border:2px solid var(--copper);border-radius:12px;background:var(--surface);text-align:center}
.cert h3{margin:4px 0 6px;font-family:var(--display);font-size:22px}
.cert input{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:min(320px,100%)}
.small{font-size:13px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-block:18px 60px}
  .side{display:none;position:static;max-height:none;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px 2px}
  .side.open{display:block}
  .menu-btn{display:inline-block}
  .bar{width:70px}
  .toc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .facts{grid-template-columns:minmax(0,1fr)}
  .brand-name small{display:none}
  .progress .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
var L = [];

/* ============ 1-DARS ============ */
L.push({id:"l1",title:"Elektr yuritma qanday tuzilgan va nega u yerda moy boshqacha",min:15,body:`
<p class="lead">Avval «temir»ni koʻrib chiqamiz. Tuzilishni tushunmasdan turib ustaga elektromobilga nega birinchi uchragan transmissiya moyini quyib boʻlmasligini tushuntira olmaysiz.</p>

<h3><span class="sec">1.1</span>Dvigatel va uzatmalar qutisi oʻrnida nima turadi</h3>
<p>Ichki yonuv dvigatelli (IYoD) mashinada ikkita alohida agregat bor: dvigatel (motor moyi) va uzatmalar qutisi (ATF, CVT suyuqligi yoki transmissiya moyi). Elektromobilda ularning oʻrnini <strong>elektr yuritma</strong> egallaydi. Uni EDU (electric drive unit), e-axle yoki «3-in-1 yuritma» deb atashadi.</p>
<div class="tbl"><table>
<tr><th>Uzel</th><th>Nima qiladi</th></tr>
<tr><td><strong>Invertor</strong></td><td>Batareyaning oʻzgarmas tokini (400–800 V) motor uchun uch fazali oʻzgaruvchan tokka aylantiradi, quvvat va rekuperatsiyani boshqaradi</td></tr>
<tr><td><strong>Elektr motor</strong></td><td>Valni aylantiradi. Koʻpincha doimiy magnitli sinxron, kamroq asinxron</td></tr>
<tr><td><strong>Reduktor</strong></td><td>Aylanishlar sonini kamaytiradi va momentni oshiradi. Odatda <strong>bitta uzatma</strong>, uzatish soni taxminan 8–11:1, ichiga differensial oʻrnatilgan</td></tr>
</table></div>

<figure class="fig">
<svg viewBox="0 0 680 230" role="img" aria-label="Elektr yuritma sxemasi: batareya, invertor, motor, reduktor, gʻildiraklar; motor va reduktor uchun umumiy moy">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ar"/></marker>
    <marker id="a1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ar-c"/></marker>
  </defs>
  <rect x="146" y="22" width="388" height="128" rx="12" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="340" y="16" text-anchor="middle" class="tt">EDU «3-in-1» — bitta agregat</text>
  <rect x="14" y="58" width="104" height="56" rx="8" class="bx"/><text x="66" y="83" text-anchor="middle" class="t">Batareya</text><text x="66" y="101" text-anchor="middle" class="ts">400–800 V</text>
  <rect x="162" y="58" width="104" height="56" rx="8" class="bx"/><text x="214" y="83" text-anchor="middle" class="t">Invertor</text><text x="214" y="101" text-anchor="middle" class="ts">DC → AC</text>
  <rect x="290" y="58" width="104" height="56" rx="8" class="bx-hl"/><text x="342" y="83" text-anchor="middle" class="t">Motor</text><text x="342" y="101" text-anchor="middle" class="ts">20 000+ ayl/min gacha</text>
  <rect x="418" y="58" width="104" height="56" rx="8" class="bx-hl"/><text x="470" y="83" text-anchor="middle" class="t">Reduktor</text><text x="470" y="101" text-anchor="middle" class="ts">≈ 8–11 : 1</text>
  <rect x="562" y="58" width="104" height="56" rx="8" class="bx"/><text x="614" y="83" text-anchor="middle" class="t">Gʻildiraklar</text><text x="614" y="101" text-anchor="middle" class="ts">moment ×10</text>
  <line x1="118" y1="86" x2="158" y2="86" class="ln" marker-end="url(#a1)"/>
  <line x1="266" y1="86" x2="286" y2="86" class="ln" marker-end="url(#a1)"/>
  <line x1="394" y1="86" x2="414" y2="86" class="ln" marker-end="url(#a1)"/>
  <line x1="522" y1="86" x2="558" y2="86" class="ln" marker-end="url(#a1)"/>
  <path d="M470 116 V136 H342 V120" class="ln-c" marker-end="url(#a1c)"/>
  <text x="406" y="176" text-anchor="middle" class="tc">Bitta moy: tishli gʻildiraklarni moylaydi va motor chulgʻamlarini sovutadi</text>
  <text x="406" y="196" text-anchor="middle" class="ts">(«hoʻl» motorlarda; «quruq» motorlarda moy faqat reduktorda)</text>
</svg>
<figcaption>Odatiy «3-in-1» yuritma. Mis rangida moy tegadigan qismlar belgilangan.</figcaption>
</figure>

<h3><span class="sec">1.2</span>1-farq: juda yuqori aylanishlar</h3>
<div class="tbl"><table>
<tr><th></th><th>IYoD li mashina</th><th>Elektromobil</th></tr>
<tr><td>Qutiga kirishdagi aylanishlar</td><td class="n">6 000–7 000 ayl/min</td><td class="n">15 000–20 000+ ayl/min</td></tr>
<tr><td>Eng yangi platformalar</td><td>—</td><td>Xitoy ishlab chiqaruvchilari 25 000–30 000 ayl/min li motorlarni koʻrsatmoqda</td></tr>
</table></div>
<p>Bu moy uchun nimani anglatadi:</p>
<ul class="list">
<li>Bunday tezlikda tishli gʻildiraklar <strong>moyni koʻpirtiradi</strong>: u koʻpiklanadi va havoga toʻyinadi.</li>
<li>Moyni aralashtirishga energiya sarflanadi. Moy qanchalik quyuq boʻlsa, yoʻqotishlar shuncha koʻp va <strong>yurish zaxirasi shuncha kam</strong>.</li>
<li>Podshipniklar oddiy qutilarda boʻlmaydigan tezliklarda ishlaydi.</li>
</ul>
<p>Shu sababli EV suyuqliklari <strong>kam qovushqoq</strong>, koʻpincha ATF ga yaqin. Klassik 75W-90 zamonaviy yuritmalarning koʻpchiligi uchun juda quyuq.</p>

<h3><span class="sec">1.3</span>2-farq: bir zumda beriladigan moment</h3>
<p>Elektr motor toʻliq momentni noldan beradi. Keskin start, rekuperatsiya (motor bilan tormozlash) va yuklama yoʻnalishining doimiy oʻzgarishi tishlarga <strong>zarbali yuklama</strong> beradi. Moy suyuq boʻlsa ham tishlarni zadir va uvalanishdan himoya qilishi kerak.</p>
<p>Bundan birinchi qarama-qarshilik kelib chiqadi: <strong>moy suyuq, lekin himoya kuchli boʻlishi kerak</strong>.</p>

<h3><span class="sec">1.4</span>3-farq: yonida elektr va mis</h3>
<p>Bu butun kursning asosiy nuqtasi. Tuzilmalar ikki xil boʻladi:</p>
<div class="tbl"><table>
<tr><th>Turi</th><th>Motor qanday sovutiladi</th><th>Moy nimaga tegadi</th></tr>
<tr><td><strong>«Quruq» motor</strong></td><td>Statorning tashqarisidagi antifriz koʻylagi</td><td>Faqat reduktor tishli gʻildiraklari va podshipniklari</td></tr>
<tr><td><strong>«Hoʻl» motor</strong> (moy bilan sovutish)</td><td>Reduktor moyi chulgʻamlarga purkaladi va/yoki rotorning ichi boʻsh vali orqali oʻtadi</td><td>Tishli gʻildiraklar, podshipniklar, <strong>mis chulgʻamlar, izolyatsiya, datchiklar</strong></td></tr>
</table></div>
<p>Yangi platformalarning koʻpchiligi (Tesla, BYD va koʻplab xitoy yuritma ishlab chiqaruvchilari) moy bilan sovutishdan foydalanadi: u samaraliroq, motor ixchamroq va kuchliroq boʻladi.</p>
<p>«Hoʻl» motorda bitta moy:</p>
<ol class="list">
<li>tishli gʻildiraklar va podshipniklarni moylaydi;</li>
<li>motorni <strong>sovutadi</strong>;</li>
<li><strong>mis</strong>, izolyatsiya laki, plastmassa va datchiklarga tegadi;</li>
<li><strong>yuqori kuchlanish</strong> yonida ishlaydi.</li>
</ol>
<p>Bundan ikkinchi, asosiy qarama-qarshilik kelib chiqadi. Oltingugurt va fosfor asosidagi zadirga qarshi qoʻshimchalar tishli gʻildiraklarni himoya qiladi, lekin <strong>misni yemiradi</strong>. EV moyi tishli gʻildiraklarni himoya qilishi va misga zarar yetkazmasligi kerak. Bu haqda 3- va 5-darslarda batafsil.</p>

<h3><span class="sec">1.5</span>Nega «birorta transmissiya moyini» quyib boʻlmaydi</h3>
<div class="tbl"><table>
<tr><th>Talab</th><th>Oddiy MKPP/koʻprik moyi (GL-4/GL-5)</th><th>EV yuritma suyuqligi</th></tr>
<tr><td>Qovushqoqlik</td><td>Yuqori (75W-90)</td><td>Past (FIK va sovutish uchun)</td></tr>
<tr><td>Misni himoya qilish</td><td>Kerak emas; GL-5 koʻpincha misga agressiv</td><td><strong>Majburiy</strong></td></tr>
<tr><td>Elektr xossalari</td><td>Meʼyorlanmaydi</td><td>Meʼyorlanadi (izolyatsiya, oʻtkazuvchanlik)</td></tr>
<tr><td>Issiqlikni olib ketish</td><td>Ikkinchi darajali</td><td>Muhim, ayniqsa «hoʻl» motorlar uchun</td></tr>
<tr><td>20 000 ayl/min dagi koʻpik</td><td>Hisoblanmagan</td><td>Hisoblangan</td></tr>
<tr><td>Chulgʻam laki bilan moslik</td><td>Tekshirilmaydi</td><td>Tekshiriladi</td></tr>
</table></div>
<div class="note"><span class="tag">Esda tuting</span><p>EV suyuqliklari uchun API GL darajasidagi yagona <strong>jahon</strong> standarti hozircha yoʻq (Xitoyda oʻz standarti bor, 9-dars). Bozor <strong>avtomobil ishlab chiqaruvchilarining talablariga</strong> tayanadi, shuning uchun tanlash doim marka, model va aniq yuritma boʻyicha qilinadi. Bu 6- va 7-darslar.</p></div>

<h3><span class="sec">1.6</span>Biznes uchun bu nimani anglatadi</h3>
<div class="note biz"><span class="tag">Savdo uchun</span>
<ul class="list">
<li>Oʻzbekistonda xitoy elektromobillari va gibridlari parki tez oʻsmoqda: BYD, Chery, Geely, Li Auto, Leapmotor, Zeekr, xitoy VW ID. Koʻp mashinalar dilerlar orqali kirib kelmagan va <strong>servislar koʻpincha nima quyishni bilmaydi</strong>. Bu aynan bizning boʻsh joyimiz (nisha).</li>
<li>Agar servis «hoʻl» motorga oddiy transmissiya moyini quysa, u minglab dollarlik yuritmani xavf ostiga qoʻyadi. <strong>Buni tushunadigan agent oddiy sotuvchi emas, maslahatchi sifatida ishlaydi</strong>.</li>
</ul></div>

L.push({id:"l2",title:"Yuqori aylanishlardagi tishli gʻildiraklar va podshipniklar, FIK va yurish zaxirasi",min:15,body:`
<p class="lead">Moy tishli gʻildiraklar ilashuvida nima qilishini, nega uni shunchaki «suyuqroq» qilib boʻlmasligini va u yurish zaxirasiga qanday taʼsir qilishini koʻrib chiqamiz.</p>

<h3><span class="sec">2.1</span>Moy pardasi: ilashuv nimaga tayanadi</h3>
<p>Tishlar bir-biriga metall bilan tegmasligi kerak. Ular orasida moy qalinligi <strong>mikronning oʻndan bir qismidan bir mikrongacha</strong> boʻlgan parda hosil qiladi. Tegish nuqtasidagi ulkan bosim ostida moy bir lahzaga deyarli qattiq holatga keladi va bu yuzalarni ushlab turadi. Bu rejim <strong>elastogidrodinamik (EGD, EHL)</strong> deb ataladi.</p>
<div class="tbl"><table>
<tr><th>Moylash rejimi</th><th>Qachon boʻladi</th><th>Kim himoya qiladi</th></tr>
<tr><td>Gidrodinamik / EGD</td><td>Normal tezlik, oʻrtacha yuklama</td><td>Moy qovushqoqligi, parda qalinligi</td></tr>
<tr><td>Aralash</td><td>Yuqori yuklama, past tezlik</td><td>Parda va qoʻshimchalar birga</td></tr>
<tr><td>Chegaraviy</td><td>Joyidan qoʻzgʻalish, eng yuqori moment, rekuperatsiya</td><td>Faqat <strong>qoʻshimchalar</strong>: ular metallda himoya qatlam hosil qiladi</td></tr>
</table></div>
<p>Parda qalinligi <strong>qovushqoqlik</strong> va <strong>tezlik</strong> bilan ortadi. EV ning kirish bosqichida tezlik ulkan va bu pardaga yordam beradi. <strong>Chiqish bosqichi va differensialda</strong> aylanishlar 8–11 marta past, moment esa 8–11 marta yuqori. Aynan u yerda parda eng yupqa.</p>

<h3><span class="sec">2.2</span>Tishli gʻildiraklar qanday shikastlanadi</h3>
<div class="tbl"><table>
<tr><th>Shikast</th><th>Koʻrinishi</th><th>Sababi</th><th>Nima himoya qiladi</th></tr>
<tr><td><strong>Zadir</strong> (scuffing)</td><td>Tish boʻylab yirtilgan chiziqlar, payvandlanish izlari</td><td>Ortiqcha yuklama, qizib ketish, pardaning uzilishi</td><td>Zadirga qarshi (EP) qoʻshimchalar</td></tr>
<tr><td><strong>Pitting</strong></td><td>Ishchi yuzadagi chuqurchalar</td><td>Tsiklik yuklamadan metall charchashi</td><td>Parda qalinligi, moy tozaligi</td></tr>
<tr><td><strong>Mikropitting</strong></td><td>Xira «kulrang dogʻlar»</td><td>Juda yupqa parda, gʻadir-budurlik</td><td>Qovushqoqlik, maxsus qoʻshimchalar, yuza sifati</td></tr>
<tr><td><strong>Yeyilish</strong></td><td>Tish profilining oʻzgarishi, tiqin magnitidagi qirindi</td><td>Abraziv, zarrachalar, chegaraviy rejim</td><td>Yeyilishga qarshi (AW) qoʻshimchalar, tozalik</td></tr>
</table></div>
<p>Qanday tekshiriladi: <strong>FZG</strong> — tishli gʻildiraklar bilan stenddagi sinov. Moy yuklama bosqichlaridan oʻtadi (12 va undan yuqori), zadirsiz bosqich qanchalik baland boʻlsa, shunchalik yaxshi. Pitting va mikropitting uchun alohida FZG usullari bor.</p>

<h3><span class="sec">2.3</span>Nega qovushqoqlikni cheksiz pasaytirib boʻlmaydi</h3>
<p>Qovushqoqlik qanchalik past boʻlsa, yoʻqotishlar shuncha kam va yurish zaxirasi shuncha katta, lekin parda shuncha yupqa. Toʻgʻri qoʻshimchalarsiz juda suyuq moy pitting va mikropittingga olib keladi. Shuning uchun ishlab chiqaruvchilar qovushqoqlikni <strong>faqat quyidagilar bilan birga</strong> pasaytiradi:</p>
<ul class="list">
<li>maxsus qoʻshimchalar paketi;</li>
<li>jilvirlangan va superfinishlangan tishlar;</li>
<li>optimallashtirilgan ilashuv geometriyasi.</li>
</ul>
<div class="note"><span class="tag">Esda tuting</span><p>EV yuritmasidagi qovushqoqlik konstruktor tomonidan aniq tishli gʻildiraklarga moslab tanlangan. «Ishonchlilik uchun quyuqroq» quyish ham, «tejash uchun suyuqroq» quyish ham birdek yomon.</p></div>

<h3><span class="sec">2.4</span>Energiya qayerga ketadi: FIK va yurish zaxirasi</h3>
<div class="tbl"><table>
<tr><th>Yoʻqotish turi</th><th>Qayerdan</th><th>Moyga bogʻliqligi</th></tr>
<tr><td>Yuklamali</td><td>Yuklama ostida ilashuvdagi ishqalanish</td><td>Ishqalanish modifikatorlari, bazaviy moy turi</td></tr>
<tr><td>Yuklamasiz</td><td>Tishli gʻildiraklar moyni aralashtirishi (barbotaj), podshipnik va zichlagichlardagi qarshilik</td><td>Qovushqoqlikka <strong>kuchli</strong> bogʻliq</td></tr>
</table></div>
<p>Elektromobil koʻp vaqt qisman yuklama bilan yuradi: shaharda va tekis yoʻlda. Shuning uchun yuklamasiz yoʻqotishlar ulushi sezilarli va qovushqoqlik energiya sarfiga bevosita taʼsir qiladi. Moy ishlab chiqaruvchilari FIK va yurish zaxirasining <strong>bir necha foiz</strong> oshishini daʼvo qiladi. Raqamlar turli sharoitlarda olingan, shuning uchun doim manbaga qarang.</p>

<h3><span class="sec">2.5</span>Sovuq va issiq</h3>
<p>−20 °C da moyning qovushqoqligi ish haroratidagiga nisbatan <strong>oʻnlab marta</strong> oshadi: yoʻqotishlar oʻsadi, nasos moyni chulgʻamlarga haydashi qiyinlashadi. Fargʻona vodiysida qishda −10…−20 °C, yozda +40…+45 °C boʻladi, agregat ichida esa moy 100 °C dan yuqori qizishi mumkin. Suyuqlik butun diapazonda ishlashi kerak.</p>

<h3><span class="sec">2.6</span>Podshipniklar, koʻpik va barqarorlik</h3>
<ul class="list">
<li><strong>Podshipniklar.</strong> Yuqori aylanishlarda sharchalar sirpanishi mumkin, moy yetishmasa «moylash ochligi» boshlanadi. Podshipniklarning elektr eroziyasi — 3-dars mavzusi.</li>
<li><strong>Koʻpik va havo.</strong> 15–20 ming ayl/min dagi tishli gʻildiraklar havo ushlaydi. Moydagi havo pardani va issiqlik olib ketishni yomonlashtiradi, nasos kavitatsiyasini keltirib chiqaradi va oksidlanishni tezlashtiradi. Sinovlar: koʻpiklanish <code>ASTM D892</code>, havo ajralishi <code>ASTM D3427</code>.</li>
<li><strong>Siljishga barqarorlik.</strong> Moydagi polimer quyuqlashtirgichlar ilashuvda «uziladi» va qovushqoqlik tushadi. KRL sinovi (<code>CEC L-45</code>) moy qancha qovushqoqlik yoʻqotishini koʻrsatadi. EV uchun bu muhim: qovushqoqlik zaxirasi baribir minimal.</li>
<li><strong>Shovqin.</strong> Dvigatel eshitilmaydi, shuning uchun tishli gʻildiraklarning gʻuvullashi seziladi. Asosiy omil — geometriya, lekin notoʻgʻri moy ham shovqin qoʻshishi mumkin. «Almashtirgandan keyin gʻuvullay boshladi» degan shikoyat — nima quyilganini tekshirish uchun sabab.</li>
</ul>

<div class="note biz"><span class="tag">Savdo uchun</span><p>Mijoz: «Probeg kichik boʻlsa, nega almashtirish kerak?» Javob: EV yuritmasidagi yeyilish faqat kilometrga emas, moment va aylanishlarga bogʻliq. Yeyilish mahsulotlari moyda qoladi va podshipniklar orqali, «hoʻl» motorlarda esa chulgʻamlar orqali ham oʻtadi. Bundan tashqari moy haroratdan eskiradi.</p></div>
`,quiz:[
{q:"Ortiqcha yuklamada tish yuzalarining bir zumda «payvandlanishi» va yirtilishi qanday ataladi?",o:["Pitting","Zadir","Korroziya"],a:1,w:"Zadir (scuffing) — parda uzilganda tez sodir boʻladigan shikast. Pitting — metallning sekin charchashi."},
{q:"EV reduktorida moy pardasi qayerda eng yupqa?",o:["18 000 ayl/min dagi kirish valida","Chiqish bosqichi va differensialda: tezlik past, moment yuqori","Hamma joyda bir xil"],a:1,w:"Parda tezlik bilan oʻsadi. Chiqish bosqichi sekin va kuchli yuklangan, shuning uchun u yerda pitting xavfi yuqoriroq."},
{q:"Nega yurish zaxirasi uchun qovushqoqlikni cheksiz pasaytirib boʻlmaydi?",o:["Moy yorugʻlik chiqara boshlaydi","Parda juda yupqa boʻlib qoladi: pitting, mikropitting, yeyilish","Moy qimmatroq boʻladi"],a:1,w:"Qovushqoqlikni faqat qoʻshimchalar va tishli gʻildiraklarning sifatli ishlovi bilan birga pasaytirish mumkin."},
{q:"KRL sinovi (CEC L-45) nimani koʻrsatadi?",o:["Moy siljishdan qancha qovushqoqlik yoʻqotishini","Mis korroziyasini","Koʻpiklanishni"],a:0,w:"KRL — siljishga barqarorlik sinovi. Koʻpik ASTM D892, mis ASTM D130 boʻyicha tekshiriladi."},
{q:"Qaysi yoʻqotishlar qovushqoqlikka eng kuchli bogʻliq?",o:["Yuklamali — ilashuvdagi ishqalanish","Yuklamasiz — moyni aralashtirish va podshipniklardagi qarshilik","Batareyadagi yoʻqotishlar"],a:1,w:"Aralashtirish (barbotaj) bevosita qovushqoqlikka bogʻliq, EV esa koʻp vaqt qisman yuklama bilan yuradi."}
]});

L.push({id:"l3",title:"Moyning elektr xossalari va mis korroziyasi",min:18,body:`
<p class="lead">Eng «elektromobilga xos» dars. Bu talablar IYoD li mashinalar uchun hech bir moyda yoʻq va servislar aynan shu yerda koʻp xato qiladi.</p>

<h3><span class="sec">3.1</span>Moy elektr bilan qayerda uchrashadi</h3>
<p>«Hoʻl» yuritmada moy stator chulgʻamlarini (hozir koʻpincha toʻgʻri burchakli simdan, hairpin texnologiyasi), mis shinalar va chiqishlarni, harorat va rotor holati datchiklarini yuvadi. Invertor motorga juda tik frontli impulslar beradi: zamonaviy SiC tranzistorlarda kuchlanish nanosekundlarda yuzlab voltga oʻzgaradi. Bu izolyatsiyani yuklaydi va kutilmagan joylarda toklar hosil qiladi.</p>

<h3><span class="sec">3.2</span>Uchta elektr koʻrsatkichi</h3>
<div class="tbl"><table>
<tr><th>Koʻrsatkich</th><th>Nimani anglatadi</th><th>Usullar</th></tr>
<tr><td><strong>Teshilish kuchlanishi</strong> (dielektrik mustahkamlik), kV</td><td>Elektrodlar orasidagi moy qaysi kuchlanishda uchqun bilan «teshiladi». Qanchalik yuqori boʻlsa, moy izolyator sifatida shunchalik yaxshi</td><td class="n">ASTM D877, D1816<br>IEC 60156</td></tr>
<tr><td><strong>Solishtirma hajmiy qarshilik / oʻtkazuvchanlik</strong></td><td>Moy tokni qanchalik oʻtkazadi</td><td class="n">IEC 60247<br>ASTM D1169</td></tr>
<tr><td><strong>Dielektrik singdiruvchanlik</strong></td><td>Moy izolyatsiyadagi elektr maydon taqsimotiga qanday taʼsir qiladi</td><td class="n">IEC 60247</td></tr>
</table></div>
<p>Moy <strong>yaxshi izolyator boʻlishi kerak, lekin mutlaq emas</strong>. Juda oʻtkazuvchan moy oqishlarga sabab boʻladi va korroziyani tezlashtiradi. Umuman oʻtkazmaydigan moy statik zaryad toʻplashi mumkin. Tadqiqotlar oʻrtacha oʻtkazuvchanlik zaryadning valdan yumshoqroq «oqib ketishiga» yordam berishini koʻrsatadi. Aniq qiymatlar oynasini yuritma ishlab chiqaruvchisi belgilaydi.</p>
<div class="note warn"><span class="tag">Muhim</span><p><strong>Suv</strong> va metall zarrachalar teshilish kuchlanishini keskin pasaytiradi. Hatto foizning bir qismi namlik izolyatorni oʻtkazgichga aylantiradi. Moy eskirganda oʻtkazuvchanlik <strong>oshadi</strong>. Shuning uchun EV suyuqligini oʻz vaqtida almashtirish va yopiq saqlash, servisda esa sapun va zichlagichlarni kuzatish kerak.</p></div>

<h3><span class="sec">3.3</span>Podshipniklardagi toklar: elektr eroziyasi</h3>
<p>Invertor impulslari motor valida kuchlanish hosil qiladi. U korpusga yoʻl qidiradi va podshipnikdagi yupqa moy pardasini teshib oʻtadi. Har bir razryad mikrokrater kuydiradi.</p>
<ul class="list">
<li><strong>Xiralik</strong> (frosting) — dumalash yoʻlakchasi yaltiroqligini yoʻqotadi.</li>
<li><strong>Qovurgʻalanish</strong> (fluting) — kir yuvish taxtasidagi kabi koʻndalang chiziqlar.</li>
<li>Belgisi: podshipnikning kuchayib boruvchi gʻuvullashi yoki chiyillashi.</li>
</ul>
<p>Asosiy himoya — konstruktiv: keramik sharchalar, valni yerga ulash choʻtkalari, izolyatsiyalangan podshipniklar. Moy — ikkinchi omil, uning elektr xossalari razryad qanday oʻtishiga taʼsir qiladi.</p>

<h3><span class="sec">3.4</span>Mis: asosiy xavf zonasi</h3>
<p>Mis chulgʻamlarda, shinalarda, kavsharlarda, datchik simlarida, baʼzan vtulka va shaybalarda bor. Zadirga qarshi qoʻshimchalardagi faol oltingugurt mis bilan reaksiyaga kirishib <strong>mis sulfidini</strong> hosil qiladi. Bu ikki sababga koʻra xavfli:</p>
<ol class="list">
<li>yupqa oʻtkazgichlar va kavsharlar asta-sekin yemiriladi;</li>
<li>mis sulfidi <strong>tok oʻtkazadi</strong>: uning choʻkmalari tok oʻtkazuvchi koʻprikchalar hosil qilib, qisqa tutashuvga olib kelishi mumkin.</li>
</ol>
<p>Alohida xavf — <strong>bugʻ fazasidagi korroziya</strong>. Oltingugurtning uchuvchan birikmalari issiq moydan bugʻlanib, <strong>moy sathidan yuqoridagi</strong> misga hujum qiladi, u yerni suyuqlik yuvmaydi.</p>

<h3><span class="sec">3.5</span>Mis himoyasi qanday tekshiriladi</h3>
<div class="tbl"><table>
<tr><th>Sinov</th><th>Mohiyati</th><th>EV suyuqligidan nima kutiladi</th></tr>
<tr><td><strong>Mis plastinka</strong> <code>ASTM D130</code></td><td>Silliqlangan mis plastinka issiq moyda, keyin rangi 1a…4c etalon shkalasi bilan solishtiriladi</td><td>1a–1b, koʻpincha qattiq sharoitda (yuqoriroq harorat, uzoqroq vaqt)</td></tr>
<tr><td><strong>Mis sim sinovi</strong></td><td>Ingichka mis sim issiq moyda yoki uning bugʻida; elektr qarshiligining oʻsishi oʻlchanadi</td><td>Qarshilikning minimal oʻsishi. Bu avtomobil va qoʻshimcha ishlab chiqaruvchilarining tarmoq usullari</td></tr>
<tr><td><strong>Bugʻ fazasi</strong></td><td>Mis issiq moy ustida osib qoʻyiladi</td><td>Qorayish va choʻkmalar yoʻq</td></tr>
</table></div>

<h3><span class="sec">3.6</span>Materiallar bilan moslik</h3>
<p>Moy quyidagilarni yumshatmasligi, eritmasligi, shishirmasligi yoki quritmasligi kerak:</p>
<ul class="list">
<li><strong>sim emali</strong> (poliamid-imid, poliefir-imid va boshq.) va <strong>shimdiruvchi laklar</strong> yoki smolalar;</li>
<li>stator pazlaridagi izolyatsion qogʻoz va plyonkalar (aramid, PET);</li>
<li>korpus va ulagichlar plastmassalari (PA66, PPS);</li>
<li>zichlagichlar (FKM, ACM, HNBR).</li>
</ul>
<p>Tekshiruv: namunalar issiq moyda yuzlab soat saqlanadi, keyin mustahkamlik, massa, qattiqlik va elektr xossalari oldingisi bilan solishtiriladi.</p>

<div class="note"><span class="tag">Adashtirmang</span><p>Reduktor moyi, batareyalarni immersion sovutish suyuqligi va batareya hamda invertor uchun antifriz — <strong>uchta turli mahsulot</strong>. EV uchun antifriz koʻpincha past elektr oʻtkazuvchanlik bilan talab qilinadi, lekin u chulgʻamlarga tegmaydi.</p></div>
<div class="note biz"><span class="tag">Savdo uchun</span><p>Mis haqidagi dalilni usta darhol tushunadi: «GL-5 da tishli gʻildiraklar uchun faol oltingugurt koʻp. «Hoʻl» motorda bu oltingugurt mis chulgʻamlarni yeydi, motorni taʼmirlash esa yuzta moy almashtirishdan qimmatroq».</p></div>
`,quiz:[
{q:"Moyning teshilish kuchlanishini nima keskin pasaytiradi?",o:["Past harorat","Suv va metall zarrachalar","Sintetik asos"],a:1,w:"Hatto foizning bir qismi namlik izolyatorni oʻtkazgichga aylantiradi."},
{q:"Nega faol oltingugurt «hoʻl» motor uchun xavfli?",o:["Moy yomon hid chiqaradi","Mis sulfidi hosil boʻladi: u simni yemiradi va tok oʻtkazuvchi choʻkmalar beradi","Oltingugurt qovushqoqlikni oshiradi"],a:1,w:"Mis sulfidi tok oʻtkazadi, shuning uchun choʻkmalar qisqa tutashuvga olib kelishi mumkin. Yupqa oʻtkazgichlar esa korroziyaga uchraydi."},
{q:"Podshipnik yoʻlakchalarining qovurgʻalanishi (fluting) nimaning oqibati?",o:["Moy yetishmasligi","Podshipnik orqali elektr razryadlari","Qum kirishi"],a:1,w:"Valdagi induksiyalangan kuchlanish podshipnik pardasi orqali razryadlanadi va mikrokraterlar kuydiradi. Shunday qilib «kir yuvish taxtasi» naqshi paydo boʻladi."},
{q:"ASTM D130 boʻyicha nima tekshiriladi?",o:["Plastinkadagi mis korroziyasi","Teshilish kuchlanishi","Qovushqoqlik yoʻqotilishi"],a:0,w:"Mis plastinka: 1a…4c shkalasi boʻyicha baho. EV uchun 1a–1b kutiladi."},
{q:"Moy eskirganda uning oʻtkazuvchanligi qanday oʻzgaradi?",o:["Oshadi","Kamayadi","Oʻzgarmaydi"],a:0,w:"Oksidlanish va yeyilish mahsulotlari oʻtkazuvchanlikni oshiradi, shuning uchun elektr xossalari vaqt oʻtishi bilan yomonlashadi."}
]});

L.push({id:"l4",title:"Moy «hoʻl» motorlar uchun sovutish suyuqligi sifatida",min:14,body:`
<p class="lead">«Hoʻl» yuritmada moy issiqlik tashuvchi boʻlib ishlaydi. U issiqlikni qanchalik yaxshi olib ketishiga quvvat, chulgʻamlar va magnitlarning resursi bogʻliq.</p>

<h3><span class="sec">4.1</span>Issiqlik qayerdan keladi va uni olib ketish nega qiyin</h3>
<p>Elektr motorning FIK yuqori, taxminan 90–97%, lekin 150–300 kVt quvvatda hatto bir necha foiz yoʻqotish ham kilovattlab issiqlik demakdir:</p>
<ul class="list">
<li><strong>chulgʻamlarda</strong> (misdagi yoʻqotishlar), ayniqsa peshona qismlarida — oʻzakdan tashqariga chiqib turgan chulgʻam halqalarida;</li>
<li><strong>poʻlat oʻzakda</strong> (qayta magnitlanishdagi yoʻqotishlar);</li>
<li><strong>rotor va magnitlarda</strong>. Magnitlar (NdFeB) qizib ketganda kuchini yoʻqotadi, qaytmas magnitsizlanishgacha.</li>
</ul>
<p>Antifriz koʻylagi statorni tashqaridan sovutadi, chulgʻamlarning peshona qismlari va rotorga esa deyarli yetmaydi. Antifriz tok oʻtkazadi, uni chulgʻamlarga quyib boʻlmaydi. Moy — dielektrik, uni <strong>toʻgʻridan-toʻgʻri issiq joylarga berish mumkin</strong>.</p>

<h3><span class="sec">4.2</span>Moy konturi qanday tuzilgan</h3>
<figure class="fig">
<svg viewBox="0 0 680 240" role="img" aria-label="Moy konturi: poddon, nasos, filtr, issiqlik almashtirgich, chulgʻamlar va ichi boʻsh valga berish, poddonga qaytish">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ar-c"/></marker>
  </defs>
  <rect x="14" y="40" width="110" height="56" rx="8" class="bx"/><text x="69" y="65" text-anchor="middle" class="t">Poddon</text><text x="69" y="83" text-anchor="middle" class="ts">reduktorning</text>
  <rect x="150" y="40" width="110" height="56" rx="8" class="bx"/><text x="205" y="65" text-anchor="middle" class="t">Nasos</text><text x="205" y="83" text-anchor="middle" class="ts">elektr./mexan.</text>
  <rect x="286" y="40" width="110" height="56" rx="8" class="bx"/><text x="341" y="65" text-anchor="middle" class="t">Filtr</text><text x="341" y="83" text-anchor="middle" class="ts">yoki setka</text>
  <rect x="422" y="40" width="110" height="56" rx="8" class="bx-t"/><text x="477" y="65" text-anchor="middle" class="t">Issiqlik almash.</text><text x="477" y="83" text-anchor="middle" class="ts">moy ↔ antifriz</text>
  <rect x="558" y="18" width="110" height="44" rx="8" class="bx-hl"/><text x="613" y="45" text-anchor="middle" class="t">Chulgʻamlar</text>
  <rect x="558" y="76" width="110" height="44" rx="8" class="bx-hl"/><text x="613" y="103" text-anchor="middle" class="t">Ichi boʻsh val</text>
  <line x1="124" y1="68" x2="146" y2="68" class="ln-c" style="stroke-dasharray:none" marker-end="url(#a4)"/>
  <line x1="260" y1="68" x2="282" y2="68" class="ln-c" style="stroke-dasharray:none" marker-end="url(#a4)"/>
  <line x1="396" y1="68" x2="418" y2="68" class="ln-c" style="stroke-dasharray:none" marker-end="url(#a4)"/>
  <path d="M532 60 L554 42" class="ln-c" style="stroke-dasharray:none" marker-end="url(#a4)"/>
  <path d="M532 76 L554 96" class="ln-c" style="stroke-dasharray:none" marker-end="url(#a4)"/>
  <path d="M613 120 V150 H69 V100" class="ln-c" marker-end="url(#a4)"/>
  <text x="340" y="170" text-anchor="middle" class="tc">Moy poddonga qaytib oqadi va yana tishli gʻildiraklarni moylaydi</text>
  <line x1="477" y1="96" x2="477" y2="196" class="ln-t" stroke-dasharray="3 3"/>
  <text x="477" y="216" text-anchor="middle" class="tt">Issiqlik antifriz konturi va radiatorga ketadi</text>
</svg>
<figcaption>Soddalashtirilgan sxema. Turli yuritmalarda elementlar toʻplami farq qiladi: qayerdadir alohida filtr yoʻq, qayerdadir moy stator kanallari orqali beriladi.</figcaption>
</figure>
<div class="tbl"><table>
<tr><th>Usul</th><th>Nimani sovutadi</th></tr>
<tr><td>Forsunka yoki trubkalardan purkash</td><td>Chulgʻamlarning peshona qismlari, statorning eng issiq joyi</td></tr>
<tr><td>Rotorning ichi boʻsh vali orqali berish</td><td>Rotor va magnitlarni ichkaridan</td></tr>
<tr><td>Stator kanallari</td><td>Chulgʻamning paz qismi</td></tr>
</table></div>

<h3><span class="sec">4.3</span>Moy issiqlik tashuvchi sifatida: kuchli va zaif tomonlari</h3>
<div class="tbl"><table>
<tr><th>Xossa</th><th>Moy</th><th>Suv-glikol (antifriz)</th></tr>
<tr><td>Issiqlik oʻtkazuvchanlik</td><td class="n">≈ 0,13–0,15 Vt/(m·K)</td><td class="n">≈ 0,4 Vt/(m·K)</td></tr>
<tr><td>Issiqlik sigʻimi</td><td class="n">≈ 2 kJ/(kg·K)</td><td class="n">≈ 3,3–3,6 kJ/(kg·K)</td></tr>
<tr><td>Chulgʻamlarga quyish mumkinmi</td><td><strong>Ha</strong> (dielektrik)</td><td>Yoʻq (tok oʻtkazadi)</td></tr>
</table></div>
<p>Suyuqlik sifatida moy issiqlikni antifrizdan yomonroq olib ketadi, lekin <strong>toʻgʻridan-toʻgʻri issiqlik manbaiga</strong> tushgani hisobiga yutadi. Qovushqoqlik qanchalik past boʻlsa, moy shunchalik tez oqadi, devor yonidagi qatlam yupqaroq va issiqlik berish yuqoriroq. Bu EV suyuqliklari suyuq boʻlishining yana bir sababi.</p>

<h3><span class="sec">4.4</span>Harorat, oksidlanish va lak</h3>
<ul class="list">
<li>Moy hajmda odatda 60–120 °C da ishlaydi, issiq chulgʻamlar yuzasida esa mahalliy ravishda kuchliroq qiziydi. Chulgʻamlar izolyatsiyasi 180 °C va undan yuqori issiqbardoshlik sinflariga moʻljallangan.</li>
<li>Yuqori harorat <strong>oksidlanishni</strong> tezlashtiradi: kislota soni va qovushqoqlik oshadi, <strong>lak va shlam</strong> paydo boʻladi.</li>
<li>Forsunka va kanallardagi lak moy berilishini kamaytiradi va chulgʻamlarning <strong>mahalliy qizib ketishiga</strong> olib keladi. Qizib ketish oksidlanishni tezlashtiradi va doira yopiladi.</li>
<li>Oksidlanish barqarorligi, masalan, ATF uchun keng qoʻllaniladigan ISOT sinovi (<code>JIS K 2514</code>) bilan tekshiriladi.</li>
</ul>
<p>Bir qator yuritmalarda almashtiriladigan filtr yoki setka bor. U bormi va qachon almashtiriladi — servis hujjatlariga qarang.</p>

<div class="note biz"><span class="tag">Savdo uchun</span><p>Oʻzbekiston — ogʻir sharoit: +40…+45 °C issiq, chang, tirbandliklar, katta probegli taksilar. Qizib ketganda yuritma <strong>quvvatni cheklaydi</strong> (derating): issiqda mashina «sustlashadi». Taksi parki uchun yangi toʻgʻri suyuqlik — bekor turishlarning oldini olishning bir qismi.</p></div>
`,quiz:[
{q:"Nega chulgʻamlar toʻgʻridan-toʻgʻri antifriz bilan emas, moy bilan sovutiladi?",o:["Moy arzonroq","Moy — dielektrik, uni toʻgʻridan-toʻgʻri chulgʻamlarga berish mumkin","Antifriz muzlaydi"],a:1,w:"Antifriz tok oʻtkazadi. Moyni kuchlanish ostidagi misga quyish mumkin."},
{q:"Qaysi suyuqlik oʻz-oʻzidan issiqlikni yaxshiroq olib ketadi?",o:["Moy","Suv-glikol (antifriz)","Bir xil"],a:1,w:"Antifrizning issiqlik oʻtkazuvchanligi va issiqlik sigʻimi yuqoriroq. Moy faqat toʻgʻridan-toʻgʻri issiqlik manbaiga tushgani bilan yutadi."},
{q:"Nega moy rotorning ichi boʻsh vali orqali beriladi?",o:["Shlitslarni moylash uchun","Rotor va magnitlarni ichkaridan sovutish uchun","Shovqinni kamaytirish uchun"],a:1,w:"Magnitlar qizib ketganda kuchini yoʻqotadi. Valning ichidan sovutish ularni himoya qilish usullaridan biri."},
{q:"Forsunkalarda lak yigʻilsa nima boʻladi?",o:["Hech narsa","Moy berilishi kamayadi, chulgʻamlar mahalliy qiziydi","Yurish zaxirasi oshadi"],a:1,w:"Oksidlanish lak beradi, lak qizishga, qizish esa oksidlanishni tezlashtiradi. Shuning uchun moy barqarorligi va almashtirish intervali muhim."},
{q:"Derating nima?",o:["Model reytingining pasayishi","Qizib ketganda yuritmaning quvvatni cheklashi","Qoʻshimcha turi"],a:1,w:"Elektronika motor va invertorni himoya qilib, quvvatni kamaytiradi. Haydovchi buni ayniqsa yozda sezadi."}
]});

L.push({id:"l5",title:"Kimyo: bazaviy moylar va qoʻshimchalar",min:16,body:`
<p class="lead">Har qanday moylash moyi — bazaviy moy va qoʻshimchalar paketi. EV suyuqliklari nimadan qilinishini va kimyogarlar «tishli gʻildiraklar va mis» qarama-qarshiligini qanday hal qilishini koʻramiz.</p>

<h3><span class="sec">5.1</span>Bazaviy moylar</h3>
<div class="tbl"><table>
<tr><th>API guruhi</th><th>Bu nima</th><th>EV suyuqliklarida</th></tr>
<tr><td class="n">I</td><td>Mineral, selektiv tozalash</td><td>Deyarli ishlatilmaydi</td></tr>
<tr><td class="n">II</td><td>Gidrotozalangan, oltingugurt kam</td><td>Baʼzan aralashmalarda</td></tr>
<tr><td class="n">III / III+</td><td>Gidrokreking, yuqori qovushqoqlik indeksi; GTL moylari ham shu guruhga kiradi</td><td><strong>Koʻp</strong> EV suyuqliklarining asosi</td></tr>
<tr><td class="n">IV</td><td>PAO (polialfaolefinlar), toʻliq sintetika</td><td>Premium suyuqliklar: sovuqda aʼlo oquvchanlik va barqarorlik</td></tr>
<tr><td class="n">V</td><td>Qolgan hammasi: efirlar, PAG va boshq.</td><td>Efirlar qoʻshimcha sifatida: qutblilik, qoʻshimchalarni eritish. Gidroliz va moslikka tekshiruv talab qiladi</td></tr>
</table></div>

<h3><span class="sec">5.2</span>Qovushqoqlik raqamlarda</h3>
<div class="tbl"><table>
<tr><th>Suyuqlik</th><th>100 °C dagi kinematik qovushqoqlik</th></tr>
<tr><td>SAE 90 (masalan, 75W-90)</td><td class="n">13,5 – 18,5 mm²/s</td></tr>
<tr><td>SAE 80</td><td class="n">11,0 – 13,5 mm²/s</td></tr>
<tr><td>Odatiy zamonaviy ATF</td><td class="n">≈ 5,5 – 7,5 mm²/s</td></tr>
<tr><td>Koʻp EV suyuqliklari</td><td class="n">≈ 4 – 8 mm²/s (yangi ishlanmalar yanada past)</td></tr>
<tr><td>Castrol ON EV W5 (BYD BOT383, yangi yuritmalar)</td><td class="n">≈ 4,3 mm²/s</td></tr>
</table></div>
<p>Kam qovushqoq moylarning oʻz muammosi bor: <strong>bugʻlanuvchanlik</strong> (Noack sinovi) va <strong>chaqnash harorati</strong>. Yengil fraksiyalar uchib ketadi, moy quyuqlashadi, sarf oʻsadi. Shuning uchun EV uchun tor fraksiyali sifatli bazaviy moylar olinadi.</p>

<h3><span class="sec">5.3</span>Qoʻshimchalar paketi</h3>
<div class="tbl"><table>
<tr><th>Qoʻshimcha</th><th>Vazifasi</th><th>EV dagi xususiyati</th></tr>
<tr><td><strong>Yeyilishga va zadirga qarshi</strong> (AW/EP)</td><td>Chegaraviy rejimda metallda himoya qatlam</td><td>Fosfor birikmalariga urgʻu, <strong>faol oltingugurt</strong> minimal. Bu asosiy murosa</td></tr>
<tr><td><strong>Metall passivatorlari</strong> (mis korroziyasi ingibitorlari)</td><td>Misda yupqa himoya parda. Benzotriazol, toliltriazol, tiadiazol hosilalari</td><td>«Hoʻl» motorlar uchun asosiy</td></tr>
<tr><td><strong>Antioksidantlar</strong></td><td>Eskirishni sekinlashtiradi (aminli, fenolli)</td><td>Issiq chulgʻamlar tufayli muhim</td></tr>
<tr><td><strong>Dispersantlar</strong></td><td>Eskirish mahsulotlarini muallaq holatda ushlab, lakning choʻkishiga yoʻl qoʻymaydi</td><td>Forsunka va sovutish kanallarining tozaligi</td></tr>
<tr><td><strong>Ishqalanish modifikatorlari</strong></td><td>Ishqalanishni boshqaradi</td><td>Yoʻqotishlarni kamaytiradi; gibridlar va 2 bosqichli qutilarda muftalar ishiga javob beradi</td></tr>
<tr><td><strong>Koʻpikka qarshi</strong></td><td>Koʻpikni soʻndiradi (silikonli, akrilatli)</td><td>Silikon ortiqcha boʻlsa <strong>havo ajralishi yomonlashadi</strong>, muvozanat kerak</td></tr>
<tr><td><strong>Quyuqlashtiruvchi polimerlar</strong> (odatda PMA)</td><td>Qovushqoqlik indeksini oshiradi</td><td>Siljishga chidashi kerak (KRL sinovi)</td></tr>
<tr><td>Depressantlar, zichlagich shishirish agentlari</td><td>Sovuqda oquvchanlik, salniklarni saqlash</td><td>Yuritma elastomerlari bilan moslik</td></tr>
</table></div>
<p>EV uchun qoʻshimcha paketlarini yirik qoʻshimcha ishlab chiqaruvchi kompaniyalar (Lubrizol, Afton, Infineum, Chevron Oronite va boshq.) ishlab chiqadi, moy kompaniyalari esa ularni oʻz bazaviy moylari bilan aralashtiradi.</p>

<h3><span class="sec">5.4</span>Murosalar uchburchagi</h3>
<figure class="fig">
<svg viewBox="0 0 680 280" role="img" aria-label="Murosalar uchburchagi: tishli gʻildiraklar himoyasi, elektr va mis, FIK va sovutish">
  <polygon points="340,40 120,240 560,240" fill="none" stroke="var(--line)" stroke-width="2"/>
  <circle cx="340" cy="40" r="7" fill="var(--teal)"/><circle cx="120" cy="240" r="7" fill="var(--copper)"/><circle cx="560" cy="240" r="7" fill="var(--teal)"/>
  <text x="340" y="22" text-anchor="middle" class="t">Tishli gʻildiraklar himoyasi</text>
  <text x="120" y="268" text-anchor="middle" class="t">Elektr va mis</text>
  <text x="560" y="268" text-anchor="middle" class="t">FIK va sovutish</text>
  <text x="216" y="126" text-anchor="end" class="ts">oltingugurt/fosfor koʻproq →</text>
  <text x="216" y="142" text-anchor="end" class="tc">mis uchun xavf</text>
  <text x="464" y="126" class="ts">qovushqoqlik yuqoriroq →</text>
  <text x="464" y="142" class="tc">FIK past, sovutish yomon</text>
  <text x="340" y="228" text-anchor="middle" class="ts">qutbli qoʻshimchalar moylashni yaxshilaydi, lekin elektrni oʻzgartiradi</text>
  <text x="340" y="160" text-anchor="middle" class="tt">EV suyuqligi — ichkaridagi</text>
  <text x="340" y="178" text-anchor="middle" class="tt">muvozanat nuqtasi</text>
</svg>
<figcaption>Bir choʻqqining har qanday «yaxshilanishi» boshqasini oʻziga tortadi. Shuning uchun faqat aniq yuritmaga muvozanatlangan suyuqlik toʻgʻri keladi.</figcaption>
</figure>

<h3><span class="sec">5.5</span>Nega EV ga tarixan ATF quyilgan</h3>
<p>Koʻp ilk elektromobillar (masalan, Nissan Leaf) reduktorda ATF ishlatgan. Mantiq tushunarli: ATF allaqachon kam qovushqoq, uning paketi AKPP ning mis va bronza detallari bilan ishlashga moʻljallangan, oksidlanish barqarorligi yaxshi. Lekin <strong>har qanday ATF ham toʻgʻri kelavermaydi</strong>: 800 V li yangi «hoʻl» motorlarda yuqori haroratda elektr xossalari va mis himoyasi muhim, oddiy ATF esa bunga tekshirilmaydi.</p>
<div class="note"><span class="tag">Esda tuting</span><p>Yorliqdagi «sintetika» soʻzining oʻzi EV bilan moslik haqida hech narsa demaydi. <strong>Qoʻshimchalar paketi va ishlab chiqaruvchi talabiga tasdiqlangan muvofiqlik</strong> hal qiladi.</p></div>
`,quiz:[
{q:"Qaysi API guruhi — PAO (polialfaolefinlar)?",o:["III guruh","IV guruh","V guruh"],a:1,w:"PAO — IV guruh. Efirlar va PAG V guruhga, gidrokreking va GTL III guruhga kiradi."},
{q:"Koʻp EV suyuqliklarining 100 °C dagi odatiy qovushqoqligi:",o:["≈ 4–8 mm²/s","13,5–18,5 mm²/s","30 mm²/s va undan yuqori"],a:0,w:"13,5–18,5 mm²/s — bu SAE 90 sinfi (75W-90). EV suyuqliklari ATF ga yaqin yoki undan ham suyuq; BYD ning W5 moyi — 4,3."},
{q:"Benzotriazol va toliltriazol hosilalari nima uchun kerak?",o:["Rang uchun","Ular misda himoya parda hosil qiladi (passivatorlar)","Quyuqlashtirish uchun"],a:1,w:"Mis passivatorlari — «hoʻl» motorlar uchun paketning asosiy qismi."},
{q:"Silikonli koʻpikka qarshi qoʻshimchaning ortiqchaligi nimasi bilan yomon?",o:["Moy yopishqoq boʻladi","Moydan havo ajralishi yomonlashadi","Sovuqda moy loyqalanadi"],a:1,w:"Silikon koʻpikni soʻndiradi, lekin mayda pufakchalar moyda uzoqroq qoladi. Muvozanat kerak."},

/* ============ 6-DARS ============ */
L.push({id:"l6",title:"Spetsifikatsiyalar, ruxsatnomalar va texnik kartani qanday oʻqish",min:16,body:`
<p class="lead">Bu agentning asosiy amaliy koʻnikmasi: toʻgʻri suyuqlikni tanlash va mijozga qanday asosda tanlanganini halol tushuntirish.</p>

<h3><span class="sec">6.1</span>Jahon standarti yoʻq, lekin Xitoyda u paydo boʻldi</h3>
<p>Motor moylari uchun API, ACEA va ILSAC, transmissiya moylari uchun API GL-4/GL-5 bor. Elektr yuritma moylari uchun yagona <strong>jahon</strong> toifasi hozircha yoʻq. Xitoyda motorni suv va moy bilan sovutish uchun alohida talablarga ega <strong>NB/SH/T 6042-2021</strong> «Toza elektr avtomobillar reduktorlari uchun moylar» tarmoq standarti amal qiladi (9-dars). ASTM, SAE va CEC mis va elektr xossalari boʻyicha sinov usullarini ishlab chiqmoqda.</p>
<p>Amalda tanlash <strong>avtomobil ishlab chiqaruvchilarining spetsifikatsiyalariga</strong> asoslanadi: har birida oʻz kodi yoki firma suyuqligi bor. BYD Castrol BOT383 va BOT384 kodlarini, Tesla — KAF1, Hyundai va Kia — ATF SP4M-1 ni koʻrsatadi.</p>

<h3><span class="sec">6.2</span>Yuritmani aslida kim qiladi</h3>
<p>Koʻp avtomobil ishlab chiqaruvchilari yuritmalarni yetkazib beruvchilardan sotib oladi. Yiriklari orasida: BYD (FinDreams), Huawei (DriveONE), Inovance, ZF, Bosch, BorgWarner, Vitesco, Nidec, Aisin. Bitta yuritma turli markadagi mashinalarda turishi mumkin va unga suyuqlik talablari bir xil. Va aksincha: bitta modelda turli yuritmalar boʻlishi mumkin.</p>

<h3><span class="sec">6.3</span>Tanlash algoritmi</h3>
<ol class="list">
<li><strong>VIN va komplektatsiya.</strong> Old, orqa yoki toʻliq yuritma (ikki agregat!), EV yoki gibrid (BYD da DM-i va EV — butunlay boshqa agregatlar), ishlab chiqarilgan yil.</li>
<li><strong>Foydalanish qoʻllanmasi yoki servis hujjatlari</strong>, «Suyuqliklar va hajmlar» boʻlimi: spetsifikatsiya nomi yoki raqami, hajmi, intervali.</li>
<li><strong>Agregatdagi lavha yoki yorliq</strong>, original suyuqlik raqami.</li>
<li>Moy ishlab chiqaruvchisining <strong>tanlash dasturi</strong>: model va VIN boʻyicha onlayn katalog.</li>
<li><strong>Maʼlumot boʻlmasa — tajriba qilmang.</strong> Moy yetkazib beruvchisining texnik yordamidan soʻrang.</li>
</ol>

<h3><span class="sec">6.4</span>Muvofiqlikning uch darajasi</h3>
<div class="tbl"><table>
<tr><th>Hujjatdagi ifoda</th><th>Nimani anglatadi</th><th>Kuchi</th></tr>
<tr><td><strong>Approved / rasmiy ruxsatnoma</strong></td><td>Avtomobil ishlab chiqaruvchisi suyuqlikni sinab, oʻz roʻyxatiga kiritgan</td><td>Eng kuchli</td></tr>
<tr><td><strong>Meets / talablarga mos</strong></td><td>Moy ishlab chiqaruvchisi suyuqlik talabga mosligini daʼvo qiladi. Javobgarlik unda</td><td>Oʻrtacha</td></tr>
<tr><td><strong>Recommended for / suitable for / tavsiya etiladi</strong></td><td>Qoʻllash boʻyicha umumiy tavsiya</td><td>Eng kuchsiz</td></tr>
</table></div>
<div class="note biz"><span class="tag">Savdo uchun</span><p>Darajani halol ayting. Agar mahsulotda «mos keladi» deyilgan boʻlsa, «ruxsatnoma bor» demang. Bitta shunday xato — va servis sizning hech bir soʻzingizga ishonmaydi.</p></div>

<h3><span class="sec">6.5</span>Texnik kartani (TDS) qanday oʻqish</h3>
<div class="tbl"><table>
<tr><th>Parametr</th><th>Usul</th><th>Nimaga qarash</th></tr>
<tr><td>40 va 100 °C dagi kinematik qovushqoqlik</td><td class="n">ASTM D445</td><td>Yuritma talabiga mos kelishi</td></tr>
<tr><td>Qovushqoqlik indeksi</td><td class="n">ASTM D2270</td><td>Yuqoriroq — qovushqoqlik harorat bilan kamroq oʻzgaradi</td></tr>
<tr><td>−40 °C da Brukfild boʻyicha qovushqoqlik</td><td class="n">ASTM D2983</td><td>Pastroq — sovuqda oquvchanlik yaxshiroq</td></tr>
<tr><td>Chaqnash / qotish harorati</td><td class="n">ASTM D92 / D97</td><td>Chaqnash yuqoriroq, qotish pastroq</td></tr>
<tr><td>Mis plastinka korroziyasi</td><td class="n">ASTM D130</td><td>1a–1b; sinov sharoitiga qarang (harorat, soat)</td></tr>
<tr><td>Koʻpiklanish</td><td class="n">ASTM D892</td><td>Uchala seriya boʻyicha kam koʻpik</td></tr>
<tr><td>Teshilish kuchlanishi</td><td class="n">ASTM D877 / D1816, IEC 60156</td><td>kV dagi qiymat va usul (turli usullar natijalari solishtirilmaydi)</td></tr>
<tr><td>Solishtirma qarshilik / oʻtkazuvchanlik</td><td class="n">IEC 60247</td><td>Yuritma ishlab chiqaruvchisi belgilagan oynaga tushishi</td></tr>
<tr><td>FZG, zadir bosqichi</td><td class="n">ISO 14635-1</td><td>Yuqoriroq — tishli gʻildiraklar himoyasi yaxshiroq</td></tr>
<tr><td>Siljishga barqarorlik (KRL)</td><td class="n">CEC L-45</td><td>Qovushqoqlik yoʻqotilishi kamroq, %</td></tr>
</table></div>

<h3><span class="sec">6.6</span>Oʻquv misoli: shartli kartani tahlil qilish</h3>
<div class="note"><span class="tag">Shartli misol, haqiqiy mahsulot emas</span>
<p><span class="mono">«E-Drive Fluid X»: KV100 = 5,8 mm²/s · VI = 165 · Brukfild −40 °C = 9 000 mPa·s · D130 = 1a (150 °C, 168 soat) · teshilish = 45 kV (D1816) · FZG &gt; 12 · «BYD … talablariga mos, … uchun tavsiya etiladi»</span></p>
<ul class="list">
<li>ATF sinfidagi qovushqoqlik, yuqori indeks — FIK va sovuq uchun yaxshi.</li>
<li>Mis qattiq sharoitda tekshirilgan — «hoʻl» motorlar uchun mos.</li>
<li>Elektr maʼlumotlari va usul bor — jiddiy mahsulot.</li>
<li>«Mos keladi», «ruxsatnoma» emas. Mijozga shunday aytamiz.</li>
</ul></div>
<div class="note warn"><span class="tag">Tuzoq</span><p>EV suyuqligi yorligʻidagi «API GL-4/GL-5» mis va elektr haqida hech narsani isbotlamaydi. Bu oddiy transmissiyalar uchun toifalar.</p></div>

<h3><span class="sec">6.7</span>Haqiqiy misol: Castrol ON EV W5 (BYD BOT383)</h3>
<div class="tbl"><table>
<tr><th>Parametr</th><th>Qiymat</th><th>Bu nimani anglatadi</th></tr>
<tr><td>100 °C dagi qovushqoqlik</td><td class="n">4,3 mm²/s</td><td>Juda past: koʻpchilik ATF dan past</td></tr>
<tr><td>40 °C dagi qovushqoqlik</td><td class="n">19 mm²/s</td><td>100 °C dagidan katta — maʼlumotlar mos</td></tr>
<tr><td>Qovushqoqlik indeksi</td><td class="n">139</td><td>Bu sinf uchun odatiy</td></tr>
<tr><td>Brukfild −40 °C</td><td class="n">4 400 mPa·s</td><td>Sovuqda yaxshi oquvchanlik</td></tr>
<tr><td>Qotish</td><td class="n">−48 °C</td><td>Oʻzbekiston uchun zaxira bilan</td></tr>
<tr><td>20 soat KRL dagi qovushqoqlik yoʻqotilishi</td><td class="n">2% dan kam</td><td>Siljishga yuqori chidamlilik</td></tr>
<tr><td>Mis</td><td>«juda yaxshi himoya»</td><td>Topilgan tavsifda raqam yoʻq — uni soʻrash kerak</td></tr>
<tr><td>Qoʻllanilishi</td><td>«Hoʻl» motorli qutilar</td><td>Bu C profili (7-dars)</td></tr>
</table></div>
<p>Bu yerda muvofiqlik darajasi eng kuchli: moy BYD qoʻllanmalarida toʻgʻridan-toʻgʻri koʻrsatilgan.</p>
`,quiz:[
{q:"EV yuritmasi uchun suyuqlik tanlashda eng muhimi nima?",o:["API GL sinfi","Aniq yuritma uchun ishlab chiqaruvchi spetsifikatsiyasi","SAE boʻyicha qovushqoqlik"],a:1,w:"Yagona jahon toifasi yoʻq, shuning uchun aniq agregat uchun avtomobil ishlab chiqaruvchisining talabi hal qiladi."},
{q:"«Meets requirements» nimani anglatadi?",o:["Avtomobil ishlab chiqaruvchisining rasmiy ruxsatnomasi","Moy ishlab chiqaruvchisining muvofiqlik haqidagi bayonoti","Original kanistrdagi moy"],a:1,w:"Bu oʻrta daraja: javobgarlik moy ishlab chiqaruvchisida. Rasmiy ruxsatnoma — «approved»."},
{q:"Nega VIN muhim?",o:["Soliq hisobi uchun","Bitta modelda turli yuritmalar boʻladi: EV yoki gibrid, bitta yoki ikkita motor","Muhim emas"],a:1,w:"Song Plus EV va Song Plus DM-i — butunlay boshqa agregatlar va suyuqliklar."},
{q:"−40 °C da Brukfild boʻyicha qovushqoqlik nimani koʻrsatadi?",o:["Qattiq sovuqdagi oquvchanlikni","Koʻpiklanishni","Elektr mustahkamlikni"],a:0,w:"Qiymat qanchalik past boʻlsa, moy sovuqda shunchalik oson haydaladi."},
{q:"Model uchun suyuqlik haqida hech qayerda maʼlumot yoʻq. Nima qilish kerak?",o:["Istalgan ATF quyish","Tajriba qilmaslik va yetkazib beruvchining texnik yordamidan soʻrash","«Ishonchlilik uchun» 75W-90 quyish"],a:1,w:"Xato yuritma narxiga tushishi mumkin. Mijoz va obroʻni yoʻqotgandan koʻra bir kun yoʻqotgan yaxshi."}

/* ============ 7-DARS ============ */
L.push({id:"l7",title:"Yuritma turlari va moy tanlash profillari (A–E)",min:18,body:`
<p class="lead">Kursning asosiy amaliy darsi: aniq mashinaning yuritma turini qanday aniqlash va bu tur uchun moy qanday xususiyatlarga ega boʻlishi kerak.</p>

<h3><span class="sec">7.1</span>Olti turdagi yuritma</h3>
<div class="tbl"><table>
<tr><th>Tur</th><th>Ichida nima bor</th><th>Moy nimaga tegadi</th><th>Hujjatlardan misollar</th></tr>
<tr><td><strong>1. Bir bosqichli reduktor + quruq motor</strong></td><td>Bir juft tishli gʻildirak va differensial; motor antifriz bilan sovutiladi</td><td>Tishli gʻildiraklar, podshipniklar, zichlagichlar</td><td>Nissan Leaf (Matic S ATF); BYD Dolphin (BOT384, bilvosita maʼlumotlarga koʻra — quruq)</td></tr>
<tr><td><strong>2. Bir bosqichli reduktor + hoʻl motor</strong></td><td>Xuddi shunday, lekin moy chulgʻamlar va rotorni sovutadi</td><td>1-turdagining hammasi + mis, izolyatsiya, datchiklar, yuqori kuchlanish</td><td>BYD Seal, Sealion 7, Atto 3 EVO (W5 moyi, filtr bilan birga almashtiriladi)</td></tr>
<tr><td><strong>3. Ikki bosqichli quti</strong></td><td>Ikki uzatma, baʼzan hoʻl mufta</td><td>Tishli gʻildiraklar, sinxronizatorlar, muftalar</td><td>Porsche Taycan orqa oʻqi (umummaʼlum misol)</td></tr>
<tr><td><strong>4. Gibrid transmissiya (DHT, EHS)</strong></td><td>IYoD yonida motor, generator va mufta</td><td>Tishli gʻildiraklar, muftalar, ikki mashina chulgʻamlari</td><td>BYD Seal U DM-i: EHSF-2LV moyi</td></tr>
<tr><td><strong>5. Planetar quvvat taqsimlagich</strong></td><td>Planetar qator va ikkita motor-generator</td><td>Tishli gʻildiraklar, podshipniklar, chulgʻamlar</td><td>Toyota va Lexus (THS)</td></tr>
<tr><td><strong>6. Har bir oʻqqa alohida yuritma</strong></td><td>Ikki agregat: old va orqa</td><td>Har bir agregat uchun 1- yoki 2-turdagidek</td><td>Tesla AWD, BYD Seal AWD, Kia EV6 AWD, Zeekr 001 AWD</td></tr>
</table></div>
<div class="note"><span class="tag">Qoʻllanmalar nimani koʻrsatdi</span><p>Topilgan barcha ikki motorli mashinalarda (Tesla, BYD Seal, Sealion 7, Atto 3 EVO, Kia EV6) <strong>old va orqa reduktorga bir xil moy quyiladi</strong>, faqat hajmi farq qiladi. Bu qonun emas: har bir yangi modelda qoʻllanma boʻyicha tekshiring.</p></div>

<h3><span class="sec">7.2</span>Aniq mashinada yuritma turini qanday aniqlash</h3>
<ol class="list">
<li><strong>VIN va komplektatsiya:</strong> nechta motor (old, orqa, toʻliq yuritma), elektromobil yoki gibrid, ishlab chiqarilgan yil.</li>
<li><strong>Qoʻllanma:</strong> «Tavsiya etilgan moylar va hajmlar» boʻlimi va texnik xizmat reglamenti.</li>
<li><strong>Hoʻl motor belgilari:</strong> reduktor moyi bilan birga <strong>filtr</strong> almashtiriladi; moy hoʻl motorlar kodi bilan belgilangan (BYD da — W5 / BOT383); tavsifda motorni moy bilan sovutish bor.</li>
<li><strong>«Faqat original» belgisi:</strong> zavod firma suyuqligini nomlaydi (Tesla KAF1, Nissan Matic S, Hyundai va Kia ATF SP4M-1).</li>
<li><strong>Hujjat boʻlmasa:</strong> moy ishlab chiqaruvchilari modelni qaysi moyga kiritganiga qarang, lekin ular xato qilishi mumkinligini unutmang (9-dars).</li>
</ol>

<h3><span class="sec">7.3</span>Moyning beshta profili</h3>
<p>Profil — moy qidiriladigan xususiyatlar toʻplami. Diapazonlar haqiqiy texnik kartalar (Mobil, Castrol, Lopal) va BYD qoʻllanmalaridan olingan. Bu standart meʼyorlari emas, <strong>bozor boʻyicha moʻljallar</strong>.</p>
<div class="tbl"><table>
<tr><th>Profil</th><th>Qaysi yuritma uchun</th><th>KV100, mm²/s</th><th>VI</th><th>Sovuq −40 °C, mPa·s</th><th>Mis va elektr</th><th>Misol</th></tr>
<tr><td><strong>A</strong></td><td>1-tur: quruq motor</td><td class="n">4,6–6,3</td><td class="n">≥ 150</td><td class="n">qanchalik past, shuncha yaxshi</td><td>Mis 1a–1b boʻlgani maʼqul; elektr majburiy emas</td><td>Castrol ON Dry D2 (6,3), Lopal E26 (5,27)</td></tr>
<tr><td><strong>B</strong></td><td>2-tur: hoʻl motor, oddiy qovushqoqlik</td><td class="n">5,0–5,9</td><td class="n">150–160</td><td class="n">≈ 5 000–5 400</td><td><strong>Majburiy:</strong> 150 °C da mis 1a–1B, elektr maʼlumotlari</td><td>Mobil EV Cool Drive 308 (5,03), Lopal E27 (5,51)</td></tr>
<tr><td><strong>C</strong></td><td>2-tur: eng yangi yuritmalar, juda past qovushqoqlik</td><td class="n">≈ 4,3</td><td class="n">139–145</td><td class="n">≈ 3 800–4 400</td><td><strong>Majburiy</strong></td><td>Castrol ON EV W5 = BYD BOT383 (4,3)</td></tr>
<tr><td><strong>D</strong></td><td>3- va 4-turlar: muftalar, sinxronizatorlar, gibridlar</td><td class="n">hujjat boʻyicha</td><td class="n">—</td><td class="n">—</td><td><strong>Majburiy</strong> + friksion xossalar</td><td>BYD EHS: EHSF-2LV</td></tr>
<tr><td><strong>E</strong></td><td>Har qanday, agar zavod suyuqlikni nomlagan boʻlsa</td><td colspan="4">Xususiyatlar boʻyicha tanlashga yoʻl qoʻyilmaydi: faqat nomlangan suyuqlik yoki rasmiy analog</td><td>Tesla KAF1, Nissan Matic S, Kia ATF SP4M-1</td></tr>
</table></div>
<div class="note warn"><span class="tag">B va C ni adashtirmang</span><p>Ikkala profil ham hoʻl motor uchun, lekin qovushqoqlik sezilarli farq qiladi: 5,0–5,9 va 4,3. C ga moʻljallangan yuritmaga B moyini yozma tasdiqsiz quyilmaydi.</p></div>

<h3><span class="sec">7.4</span>Texnik kartada qaysi xossalarni tekshirish</h3>
<div class="tbl"><table>
<tr><th>Xossa</th><th>Usul</th><th>Kim uchun muhim</th><th>Qizil bayroq</th></tr>
<tr><td>40 va 100 °C dagi qovushqoqlik</td><td class="n">ASTM D445</td><td>Hammasi</td><td>Qiymatlar yoʻq; 40 °C da 100 °C dagidan kam (kartadagi xato)</td></tr>
<tr><td>Qovushqoqlik indeksi, sovuq −40 °C</td><td class="n">D2270, D2983</td><td>Hammasi</td><td>Sovuq boʻyicha maʼlumot yoʻq</td></tr>
<tr><td>Koʻpik va havo ajralishi</td><td class="n">D892, D3427</td><td>Hammasi</td><td>Koʻpik boʻyicha maʼlumot yoʻq</td></tr>
<tr><td>Tishli gʻildiraklar himoyasi</td><td class="n">FZG</td><td>Hammasi</td><td>Faqat «zadirga qarshi» soʻzi, bosqichsiz</td></tr>
<tr><td>Siljishga barqarorlik</td><td class="n">CEC L-45 (KRL)</td><td>Hammasi, ayniqsa C</td><td>Maʼlumot yoʻq</td></tr>
<tr><td>Mis</td><td class="n">D130, mis sim sinovi, bugʻ fazasi</td><td>B, C, D</td><td>Faqat 100 °C dagi D130, moy esa hoʻl motorlar uchun deb eʼlon qilingan</td></tr>
<tr><td>Elektr</td><td class="n">D1816, IEC 60156, IEC 60247</td><td>B, C, D</td><td>Na raqam, na usul yoʻq</td></tr>
<tr><td>Emal va laklar bilan moslik</td><td>namunalarni saqlash</td><td>B, C, D</td><td>Bayonot yoʻq</td></tr>
<tr><td>Friksion xossalar</td><td>stend sinovlari</td><td>D</td><td>Ruxsatnomasiz universal ATF</td></tr>
</table></div>

<h3><span class="sec">7.5</span>Algoritm va stop-qoidalar</h3>
<ol class="list">
<li>VIN boʻyicha mashinaning barcha agregatlarini va har birining turini aniqlang.</li>
<li>Zavod hujjatini toping: suyuqlik nomi, hajmi, intervali.</li>
<li>Agar suyuqlik nomlangan boʻlsa — bu E profili: aynan uni yoki rasmiy analogini qidiring.</li>
<li>Nomlanmagan boʻlsa — A–D profilini tanlang va taklif qilinayotgan moyning texnik kartasini 7.4-jadval boʻyicha solishtiring.</li>
<li>Maʼlumot yetmasa — toʻxtang va yetkazib beruvchidan qoʻllanilishi haqida xat soʻrang.</li>
</ol>
<div class="note warn"><span class="tag">Stop-qoidalar</span><ul class="list">
<li>Model uchun tasdiq yoʻq — «mos keladi» demang, «aniqlayapman» deng.</li>
<li>Motor turi nomaʼlum — xavfni hoʻl motor kabi baholang, lekin baribir hujjat bilan tasdiqlang.</li>
<li>Mis va elektr maʼlumotlarisiz faqat «API GL-4/GL-5» — hoʻl motorlar uchun emas.</li>
<li>Zavod taqiqlasa, turli avlod suyuqliklarini aralashtirmang (Tesla).</li>
</ul></div>

<h3><span class="sec">7.6</span>Uchta tahlil</h3>
<div class="tbl"><table>
<tr><th>Mashina</th><th>Mulohaza</th><th>Natija</th></tr>
<tr><td><strong>BYD Seal AWD</strong></td><td>Qoʻllanma: old va orqa — BOT-383 / W5, 1,6 va 1,55 l. W5 — hoʻl motorlar uchun moy, KV100 4,3</td><td>C profili, original Castrol W5. Analog — faqat yozma tasdiq bilan</td></tr>
<tr><td><strong>BYD Atto 3 (avvalgi)</strong></td><td>Qoʻllanma yoʻq. Castrol va Lopal quruqqa, FUCHS hoʻlga kiritadi</td><td>Toʻxtash: VIN va diler orqali aniqlash</td></tr>
<tr><td><strong>Kia EV6</strong></td><td>Qoʻllanma ATF SP4M-1 va brendlar roʻyxatini nomlaydi</td><td>E profili: faqat roʻyxatdagi SP4M-1</td></tr>
</table></div>
<p>Barcha topilgan modellar va reduktorlar boʻyicha jadval — <a href="#permodel">«Modellar boʻyicha moy tanlash»</a> maʼlumotnomasida.</p>

L.push({id:"l8",title:"Gibridlar: DHT qutilari, BYD DM-i, Toyota va boshqalar",min:16,body:`
<p class="lead">Gibridlar hozir Oʻzbekistondagi eng ommaviy «elektrlashtirilgan» segment va bu yerda bir nechta suyuqlik bor. MITAL uchun bu yana motor moyi bozori hamdir.</p>

<h3><span class="sec">8.1</span>Gibrid turlari</h3>
<div class="tbl"><table>
<tr><th>Tur</th><th>Qanday ishlaydi</th><th>Misollar</th><th>Transmissiya suyuqligi</th></tr>
<tr><td><strong>Quvvat taqsimlagichli HEV</strong></td><td>Planetar mexanizm IYoD quvvatini gʻildiraklar va generator oʻrtasida taqsimlaydi. Ichida ikkita motor-generator, bosqichli uzatmalar yoʻq</td><td>Toyota, Lexus (THS)</td><td>Spetsifikatsiyalangan ATF (Toyota da — ATF WS)</td></tr>
<tr><td><strong>DHT</strong> (maxsus gibrid transmissiya)</td><td>Motor, generator va mufta (yoki bir nechta uzatma) bitta korpusda. Shaharda elektrda yuradi, trassada IYoD gʻildiraklarni toʻgʻridan-toʻgʻri aylantirishi mumkin</td><td>BYD DM-i / DM-p, Geely, Chery, GWM</td><td>Ishlab chiqaruvchi spetsifikatsiyasidagi, muftalar uchun friksion xossali suyuqlik</td></tr>
<tr><td><strong>P2 / gibrid AKPP yoki DCT</strong></td><td>Elektr motor oddiy qutiga oʻrnatilgan</td><td>Koʻp yevropa PHEV lari</td><td>Ruxsatnoma boʻyicha ATF yoki DCTF</td></tr>
<tr><td><strong>EREV</strong> (yurish zaxirasini oshiruvchi)</td><td>Gʻildiraklarni faqat elektr motor aylantiradi, IYoD generator boʻlib ishlaydi</td><td>Li Auto, Leapmotor C11 REEV, Voyah</td><td>EV yuritmasidagi kabi, plyus motor moyli IYoD</td></tr>
</table></div>

<h3><span class="sec">8.2</span>DHT suyuqligidan nima talab qilinadi</h3>
<p>1–5-darslardagi hammasi plyus:</p>
<ul class="list">
<li><strong>Friksion xossalar.</strong> Mufta silliq, siltanmasdan ulanishi kerak (antishudder), ishqalanish koeffitsiyenti esa butun xizmat muddati davomida barqaror qolishi kerak.</li>
<li><strong>Ikki elektr mashinani sovutish</strong> (motor va generator), odatda «hoʻl».</li>
<li>Agregat IYoD yonida tursa, <strong>IYoD dan qizish</strong>.</li>
<li>Koʻp bosqichli DHT larda sinxronizatorlar va tishli gʻildiraklarni himoya qilish.</li>
</ul>
<div class="note warn"><span class="tag">Koʻp uchraydigan xato</span><p>DHT ga «universal ATF» quyish. Muftalar uchun suyuqliklarning oʻz friksion xususiyatlari bor. Xato siltanish, ulanishda tebranish va friksionlarning tez yeyilishiga olib keladi.</p></div>

<h3><span class="sec">8.3</span>Gibriddagi dvigatel — alohida ogʻir hayot</h3>
<p>Gibrid IYoD oddiy mashinadagidan boshqacha ishlaydi:</p>
<ul class="list">
<li>Tez-tez ishga tushish va toʻxtash. Dvigatel uzoq vaqt qisqa tsikllarda ishlab, <strong>qizimasligi</strong> mumkin.</li>
<li>Bundan <strong>kondensat</strong> va <strong>moydagi yoqilgʻi</strong>: emulsiya (qopqoqdagi «mayonez»), suyulish, korroziya.</li>
<li>Atkinson va Miller tsikllari, yuqori siqish darajasi, LSPI ga (past tezlikdagi erta alangalanish) moyil turbomotorlar.</li>
<li>Ishlab chiqaruvchi talabi boʻyicha juda past qovushqoqlik: 0W-20, 0W-16, baʼzan undan ham past.</li>
</ul>
<p>Talablar: dolzarb API va ILSAC toifalari yoki ishlab chiqaruvchi spetsifikatsiyasi, LSPI dan himoya, yaxshi korroziyaga qarshi xossalar, suv va yoqilgʻiga chidamlilik.</p>

<h3><span class="sec">8.4</span>Gibridda nechta suyuqlik</h3>
<div class="tbl"><table>
<tr><th>Tizim</th><th>Suyuqlik</th></tr>
<tr><td>Dvigatel</td><td>Motor moyi (past qovushqoqlik, ruxsatnoma boʻyicha)</td></tr>
<tr><td>Transmissiya / DHT</td><td>ATF, DHT suyuqligi yoki spetsifikatsiya boʻyicha e-fluid</td></tr>
<tr><td>IYoD va elektronikani sovutish</td><td>Antifriz; koʻpincha ikkita kontur</td></tr>
<tr><td>Batareya</td><td>Tizimga qarab antifriz yoki konditsioner xladagenti</td></tr>
<tr><td>Tormozlar</td><td>Tormoz suyuqligi</td></tr>
</table></div>
<div class="note biz"><span class="tag">Savdo uchun</span><p>Gibridlar — MITAL uchun eng tez kirish yoʻli. <strong>Ularga motor moyi har doim kerak</strong>, koʻpincha oddiy mashinalardan ham tez-tez: ogʻir sharoitda interval qisqartiriladi. Ustaga kondensat va qisqa tsikllar haqida tushuntira oladigan agent kanistr emas, ekspertiza sotadi.</p></div>

<h3><span class="sec">8.5</span>Qoʻllanmadan misol: BYD Seal U DM-i</h3>
<div class="tbl"><table>
<tr><th>Uzel</th><th>Suyuqlik</th><th>Hajm</th><th>Almashtirish</th></tr>
<tr><td>Dvigatel</td><td>Motor moyi 0W-20, ACEA C5 sinfi va yuqori</td><td class="n">3,3 l (2WD) / 3,9 l (4WD), filtr bilan</td><td>reglament boʻyicha</td></tr>
<tr><td>EHS gibrid transmissiyasi</td><td>EHSF-2LV (firma moyi)</td><td class="n">3,0 l (2WD) / 3,7 l (4WD)</td><td>moy va filtr har 4 yil / 60 000 km da</td></tr>
<tr><td>Orqa elektr yuritma (4WD)</td><td>BOT384</td><td class="n">0,8 l</td><td>har 4 yil / 60 000 km da</td></tr>
</table></div>
<p>Hatto BYD gibridida ham motor moyi — ommaviy pozitsiya (0W-20, ACEA C5), transmissiya suyuqliklari esa firma suyuqliklari. Bu MITAL uchun tez kirish yoʻli qayerda ekanini yaxshi koʻrsatadi.</p>
`,quiz:[
{q:"DHT nima?",o:["Dizel gibrid turbinasi","Maxsus gibrid transmissiya: motorlar, generator va muftalar bitta korpusda","Batareya turi"],a:1,w:"Dedicated Hybrid Transmission. Misol — BYD DM-i."},
{q:"Toyota THS transmissiyasi qanday tuzilgan?",o:["Klassik 6 bosqichli AKPP","Ikkita motor-generatorli planetar quvvat taqsimlagich","Tasmali variator"],a:1,w:"Bosqichli uzatmalar yoʻq. Quvvat taqsimotini planetar mexanizm boshqaradi."},
{q:"Nega gibrid dvigateliga oddiynikidan ogʻirroq?",o:["U kuchliroq","Tez-tez ishga tushish va qizimaslik: moyga kondensat va yoqilgʻi tushadi","U moysiz ishlaydi"],a:1,w:"Qisqa tsikllar moyda suv va yoqilgʻi beradi, bu esa emulsiya, suyulish va korroziya demakdir."},
{q:"EREV (masalan, Li Auto) — bu qachonki…",o:["Gʻildiraklarni elektr motor aylantiradi, IYoD esa generator boʻlib ishlaydi","IYoD gʻildiraklarni aylantiradi, motor yordam beradi","IYoD siz mashina"],a:0,w:"Ketma-ket gibrid. Yuritma EV dagidek, lekin dvigatel bor va unga motor moyi kerak."},
{q:"Bir bosqichli reduktorga nisbatan DHT suyuqligi talablariga nima qoʻshiladi?",o:["Hech narsa","Muftalar uchun friksion xossalar","Yuqori qovushqoqlik"],a:1,w:"Muftalar barqaror ishqalanish koeffitsiyenti va siltanishdan himoya (antishudder) talab qiladi."}
]});
