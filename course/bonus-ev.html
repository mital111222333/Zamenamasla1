L.push({id:"l9",title:"Xitoy bozori: standart, ishlab chiqaruvchilar va moy kodlari",min:15,body:`
<p class="lead">Xitoy eng koʻp elektromobil ishlab chiqaradi. U yerda qanday qoidalar amal qilishini, moylarni kim qilishini va qoʻllanmalardagi moy belgilarini qanday oʻqishni koʻrib chiqamiz.</p>

<h3><span class="sec">9.1</span>NB/SH/T 6042-2021 standarti</h3>
<ul class="list">
<li>Nomi: «Toza elektr avtomobillar reduktorlari uchun moylar» (纯电动汽车减速箱用油). Xitoy Milliy energetika boshqarmasi tomonidan 16.11.2021 da chiqarilgan, 16.05.2022 dan amal qiladi.</li>
<li>Xitoy nashrlariga koʻra — bunday moylar uchun dunyodagi birinchi ochiq standart. Ishlab chiqishga Sinopec (Great Wall brendi) boshchilik qilgan.</li>
<li>Talablar <strong>ikki jadvalga</strong> boʻlingan: motori <strong>suv</strong> bilan va <strong>moy</strong> bilan sovutiladigan mashinalar uchun. Bu A profili va B/C profillari bilan bir xil mantiq.</li>
<li>Raqamli chegaralar ochiq manbalarda topilmadi: toʻliq matn pullik (inglizcha tarjimasi ChineseStandard.net da sotiladi).</li>
</ul>

<h3><span class="sec">9.2</span>BYD reduktor moyini qanday belgilaydi</h3>
<div class="tbl"><table>
<tr><th>Qoʻllanmadagi belgi</th><th>Bu nima</th><th>Qayerda uchraydi</th></tr>
<tr><td><strong>BOT383 / W5 / EV3.0</strong></td><td>Castrol ON EV Transmission Fluid W5 — Seagull qoʻllanmasida shunday toʻgʻridan-toʻgʻri yozilgan. Hoʻl motorlar uchun moy: KV100 4,3, VI 139</td><td>Seal, Sealion 7, Atto 3 EVO, Seagull</td></tr>
<tr><td><strong>BOT384 / EV2.0</strong></td><td>Boshqa Castrol suyuqligi. Texnik kartasi topilmadi; bilvosita maʼlumotlarga koʻra — D2 sinfidagi quruq moy (KV100 ≈ 6,3). Bu xulosa, BYD maʼlumoti emas</td><td>Dolphin, Seagull (variant sifatida), Seal U DM-i orqa yuritmasi</td></tr>
<tr><td><strong>EHSF-2LV</strong></td><td>EHS gibrid transmissiyasi uchun firma moyi</td><td>Seal U DM-i</td></tr>
</table></div>
<p>Shunga oʻxshash kodlar moy ishlab chiqaruvchilarida ham uchraydi: Lopal E274 texnik kartasida «BYD uchun W5 darajasi», E27 da — «BOT 805C EV spetsifikatsiyasi» tilga olingan. Moy ishlab chiqaruvchilari ham shu zavod kodlariga tayanadi.</p>

<h3><span class="sec">9.3</span>Moylarni kim qiladi</h3>
<div class="tbl"><table>
<tr><th>Guruh</th><th>Kompaniyalar</th></tr>
<tr><td>Xitoy kompaniyalari</td><td>Sinopec (Great Wall), PetroChina (Kunlun), Lopal, Tongyi, Copton</td></tr>
<tr><td>Xitoydagi xalqaro kompaniyalar</td><td>Castrol (BYD zavod quyilmasi), Mobil, FUCHS, Shell, TotalEnergies</td></tr>
<tr><td>Qoʻshimcha ishlab chiqaruvchilari</td><td>Lubrizol, Afton, Infineum, Chevron Oronite — koʻpchilik brendlar uchun qoʻshimcha paketlarini qiladi</td></tr>
</table></div>
<p>Saytlari bilan batafsil — <a href="#makers">«Xitoydagi ishlab chiqaruvchilar»</a> maʼlumotnomasida; topilgan barcha moylar raqamlari bilan — <a href="#catalog">«Moylar katalogi»</a>da.</p>

<h3><span class="sec">9.4</span>Bozor raqamlari nima deydi</h3>
<div class="tbl"><table>
<tr><th>Moylar oilasi</th><th>KV100, mm²/s</th><th>Misollar</th></tr>
<tr><td>Hoʻl motor, juda past qovushqoqlik (yangi yuritmalar)</td><td class="n">≈ 4,3</td><td>Castrol W5 (BYD BOT383), Lopal E274, Lopal E27 PRO</td></tr>
<tr><td>Hoʻl motor, oddiy qovushqoqlik</td><td class="n">≈ 5,0–5,9</td><td>Mobil EV Cool Drive 308, 311, MS 304, MS 902; Lopal E27</td></tr>
<tr><td>Quruq motor</td><td class="n">≈ 4,6–6,3</td><td>Castrol D1, D2; Lopal E26</td></tr>
</table></div>

<h3><span class="sec">9.5</span>Manbalarga koʻr-koʻrona ishonib boʻlmaydi</h3>
<ul class="list">
<li><strong>Moy ishlab chiqaruvchisining tavsiyasi zavod bilan farq qilishi mumkin.</strong> FUCHS BYD Seal ni qovushqoqligini koʻrsatmasdan oʻzining hoʻl motorlar uchun moyiga kiritadi, BYD qoʻllanmasi esa juda past qovushqoqlikdagi W5 ni nomlaydi.</li>
<li><strong>Texnik kartalardagi xatolar.</strong> Mobil EV Cool Drive 043 sahifasida 40 °C dagi qovushqoqlik 100 °C dagidan kam — bunday boʻlmaydi. Lopal kartalarida chaqnash harorati uchun qotish harorati usuli koʻrsatilgan.</li>
<li><strong>Bitta model — turli maʼlumotlar.</strong> Lopal Chery eQ7 ni ham E26 (quruq), ham E27 (hoʻl) roʻyxatida koʻrsatadi.</li>
<li><strong>OAV maqolalari.</strong> 2026-yilgi xitoy maqolasi BYD uchun 24 oy / 40 000 km, keyin 48 oy / 80 000 km interval keltiradi, Seal ning yevropa qoʻllanmasi esa — 24 oy / 30 000 km, keyin 24 oy / 48 000 km.</li>
</ul>
<div class="note"><span class="tag">Ishonch tartibi</span><p>Zavod qoʻllanmasi → raqamli texnik karta → moy ishlab chiqaruvchisi tavsiyasi → maqola yoki reklama.</p></div>
`,quiz:[
{q:"NB/SH/T 6042-2021 nima?",o:["Amerika motor moylari standarti","Motorni suv va moy bilan sovutish uchun alohida talablarga ega, elektromobil reduktorlari moylari boʻyicha xitoy tarmoq standarti","BYD ruxsatnomasi"],a:1,w:"Standartning ikki jadvali quruq va hoʻl motorga mos keladi."},
{q:"BYD qoʻllanmalaridagi BOT383 — bu…",o:["Tormoz suyuqligi","Castrol ON EV Transmission Fluid W5","Antifriz"],a:1,w:"BYD Seagull qoʻllanmasida shunday toʻgʻridan-toʻgʻri yozilgan."},
{q:"Moy ishlab chiqaruvchisining tavsiyasi zavod qoʻllanmasi bilan farq qiladi. Nimaga ishonish kerak?",o:["Moy ishlab chiqaruvchisiga","Zavod qoʻllanmasiga","Arzonroq moyni tanlash"],a:1,w:"Ishonch tartibi: qoʻllanma → texnik karta → tavsiya → reklama."},
{q:"Texnik kartada 40 °C dagi qovushqoqlik 100 °C dagidan kam. Bu nimani anglatadi?",o:["Moy juda yaxshi","Maʼlumotlarda xato","Shunday boʻlishi kerak"],a:1,w:"Qizdirilganda moy doim suyuqlashadi. Bunday maʼlumotlarni qayta tekshirish kerak."},
{q:"Hoʻl motorlar moylarida qovushqoqlikning qaysi ikki «oilasi» koʻrinadi?",o:["≈ 4,3 va ≈ 5–6 mm²/s","≈ 13 va ≈ 18 mm²/s","≈ 1 va ≈ 2 mm²/s"],a:0,w:"Juda past (W5, Lopal E274) va oddiy (Mobil 308, Lopal E27)."}
]});

L.push({id:"l10",title:"Servis: Oʻzbekiston parki, hajmlar, intervallar, almashtirish",min:15,body:`
<p class="lead">Nazariyadan servisga oʻtamiz: qanday mashinalar yuradi, qancha suyuqlik kerak, uni qachon almashtirish va buni qanday toʻgʻri bajarish.</p>

<h3><span class="sec">10.1</span>Oʻzbekistonda nimalar yuradi</h3>
<p>Elektromobil va gibridlar parki import imtiyozlari va mahalliy yigʻish tufayli tez oʻsmoqda. BYD mashinalarni Jizzaxda yigʻadi, masalan Chazor va Song Plus DM-i. Eng koʻp uchraydiganlari:</p>
<ul class="list">
<li><strong>BYD</strong>: Song Plus (EV va DM-i), Chazor, Han, Seal, Yuan;</li>
<li><strong>xitoy VW</strong>: ID.4 va ID.6;</li>
<li><strong>Chery / Exeed, Geely, Zeekr, Changan, Leapmotor, Voyah, Hongqi</strong>;</li>
<li><strong>Li Auto</strong> (EREV);</li>
<li>Tesla va yevropa EV lari — asosan diler orqali emas, yakka holda olib kelingan mashinalar.</li>
</ul>
<p>Koʻp mashinalar xususiy tarzda olib kelingan: diler servisi yoʻq, hujjatlar xitoy tilida, ustalar suyuqlikni taxminan tanlaydi.</p>

<h3><span class="sec">10.2</span>Qancha moy kerak: qoʻllanmalar maʼlumotlari</h3>
<div class="tbl"><table>
<tr><th>Model</th><th>Old reduktor</th><th>Orqa reduktor</th><th>Moy</th></tr>
<tr><td>BYD Seagull</td><td class="n">0,55 l</td><td>—</td><td>Castrol BOT384 yoki BOT383 (W5)</td></tr>
<tr><td>BYD Dolphin</td><td class="n">0,45 yoki 0,60 l</td><td>—</td><td>BOT384</td></tr>
<tr><td>BYD Seal, Sealion 7</td><td class="n">1,6 l (AWD)</td><td class="n">1,55 l</td><td>BOT-383 / W5</td></tr>
<tr><td>BYD Atto 3 EVO</td><td class="n">1,8 l (AWD)</td><td class="n">1,55 l</td><td>BOT383 / W5 + filtr</td></tr>
<tr><td>BYD Seal U DM-i</td><td class="n">EHS: 3,0 l (2WD) / 3,7 l (4WD)</td><td class="n">0,8 l (4WD)</td><td>EHSF-2LV / BOT384</td></tr>
<tr><td>Tesla Model 3 / Y</td><td class="n">1,3 l (AWD)</td><td class="n">2,1–2,3 l</td><td>KAF1</td></tr>
<tr><td>Nissan Leaf</td><td class="n">1,4 l</td><td>—</td><td>Matic S</td></tr>
<tr><td>MG4</td><td>—</td><td class="n">0,9 l</td><td>Shell E-Fluid E6 iX (qoʻllanma tavsifi boʻyicha)</td></tr>
<tr><td>Kia EV6</td><td class="n">3,2–3,3 l (AWD)</td><td class="n">3,4–3,5 l</td><td>ATF SP4M-1</td></tr>
<tr><td>Hyundai Ioniq 5</td><td class="n">3,2 l</td><td class="n">3,4 l</td><td>HK ATF SP4M-1</td></tr>
</table></div>
<p>Ikki maktab koʻrinadi: BYD da reduktor kichik (0,5–1,8 l), Hyundai va Kia da — 3,2–3,5 l ATF turidagi suyuqlik. Toʻliq yuritmali mashinada buyurtma hajmi ikkita reduktordan qoʻshiladi.</p>
<p class="small">Har bir reduktor boʻyicha — <a href="#permodel">«Modellar boʻyicha moy tanlash»</a> maʼlumotnomasida.</p>

<h3><span class="sec">10.3</span>Almashtirish intervallari: qoʻllanmalar maʼlumotlari</h3>
<div class="tbl"><table>
<tr><th>Model</th><th>Birinchi almashtirish</th><th>Keyin</th><th>Nima almashtiriladi</th></tr>
<tr><td>BYD Seal, Dolphin</td><td>24 oy / 30 000 km</td><td>har 24 oy / 48 000 km da</td><td>Moy</td></tr>
<tr><td>BYD Atto 3 EVO</td><td>24 oy / 20 000 km</td><td>har 24 oy / 30 000 km da</td><td>Moy va filtr</td></tr>
<tr><td>BYD Sealion 7</td><td>24 oy / 20 000 mil</td><td>har 24 oy / 30 000 mil da</td><td>Moy va filtr</td></tr>
<tr><td>BYD Seagull</td><td colspan="2">har 12 oy / 20 000 km da tekshirish</td><td>Moy</td></tr>
<tr><td>BYD Seal U DM-i</td><td colspan="2">har 4 yil / 60 000 km da</td><td>EHS moyi va filtr</td></tr>
</table></div>
<ul class="list">
<li>BYD da birinchi almashtirish keyingilaridan oldinroq: tishli gʻildiraklarning moslashuv mahsulotlari chiqariladi.</li>
<li><strong>Ogʻir sharoit</strong> (taksi, issiq, chang, tez-tez tezlanish, togʻ) — intervalni qisqartirish uchun asos.</li>
<li>Avtoparklar uchun eng yaxshi vosita — <strong>ishlatilgan moy tahlili</strong>: temir, mis, suv, qovushqoqlik, kislota soni.</li>
</ul>
<div class="note"><span class="tag">Signal</span><p>Tahlilda <strong>mis</strong>ning oʻsishi — xavotirli belgi: chulgʻamlar, vtulkalar yoki oʻtkazgichlar korroziyasi. Nima quyilganini tekshiring.</p></div>

<h3><span class="sec">10.4</span>Almashtirish tartibi (umumiy sxema)</h3>
<ol class="list">
<li>VIN boʻyicha spetsifikatsiya va hajmni tasdiqlash.</li>
<li>Mashinani koʻtargichga tekis qoʻyish, tizimni yoʻriqnoma boʻyicha oʻchirish (xizmat rejimi).</li>
<li><strong>Avval quyish tiqinini burab oching</strong>, ochilishiga ishonch hosil qiling va faqat keyin toʻkish tiqinini.</li>
<li>Toʻkilgan moy va tiqin magnitini koʻzdan kechiring: qirindi, metall pasta, suv (loyqalik, «sut»), kuygan hid.</li>
<li>Yangi zichlagich shaybalar, tortish momenti hujjat boʻyicha.</li>
<li>Sathgacha quying. Koʻpincha sath — quyish teshigining pastki chetigacha, lekin baʼzi agregatlarda diagnostika skaneri orqali nasos bilan haydash va belgilangan haroratda sathni tekshirish tartibi bor.</li>
<li>Almashtirishni servis tarixiga yozib qoʻying.</li>
</ol>
<div class="note warn"><span class="tag">Xavfsizlik</span><p>Toʻq sariq kabel va ulagichlar — <strong>yuqori kuchlanish</strong>. Moy almashtirish — faqat mexanik qism bilan ish. Yuqori voltli ulagichlarga tegmang, elektr taʼmiriga faqat oʻqitilgan xodimlar qoʻyiladi.</p></div>
<div class="note biz"><span class="tag">OilBook uchun gʻoya</span><p>OilBook ga alohida interval va mijozga eslatmali «EV yuritma suyuqligi» xizmat turini qoʻshish. Servis uchun bu takroriy tashrif, MITAL uchun — muntazam talab.</p></div>

{q:"Elektromobil taksi, +45 °C issiq — bu qanday sharoit?",o:["Normal","Ogʻir: almashtirish intervali qisqartiriladi","Yengil"],a:1,w:"Katta probeg, issiq, chang va tezlanishlar — klassik ogʻir sharoit."},

/* ============ 11-DARS ============ */
L.push({id:"l11",title:"B2B savdo, eʼtirozlar va MITAL nimani taklif qila oladi",min:15,body:`
<p class="lead">Agent toʻgʻri savollar bersa, eʼtirozlarga javob bersa va ortiqcha vaʼda bermasa, bilim savdoga aylanadi.</p>

<h3><span class="sec">11.1</span>Kimga sotish kerak</h3>
<div class="tbl"><table>
<tr><th>Segment</th><th>Mijoz uchun nima muhim</th></tr>
<tr><td>Ixtisoslashgan EV servislari</td><td>Aniq tanlash, mavjudlik, texnik yordam</td></tr>
<tr><td>EV va gibridlarni qabul qila boshlagan oddiy STO lar</td><td>Ustalarni oʻqitish, tanlash jadvali, kichik qadoqlar</td></tr>
<tr><td>Taksi parklari va agregator haydovchilari</td><td>Bekor turish, resurs, kilometr narxi, intervallar</td></tr>
<tr><td>Korporativ avtoparklar</td><td>Hujjatlar, hisobot, xizmat reglamenti</td></tr>
<tr><td>Avtoehtiyot qismlar doʻkonlari</td><td>Aylanma, xaridor uchun tushunarli tanlash</td></tr>
<tr><td>Xitoy markalari sotuvchilari huzuridagi servislar</td><td>Hajm, barqaror yetkazib berish, spetsifikatsiyalarga moslik</td></tr>
</table></div>

<h3><span class="sec">11.2</span>Uchrashuvdagi savollar</h3>
<ol class="list">
<li>Sizga qanday elektromobil va gibridlar keladi? Qaysi markalar eng koʻp?</li>
<li>Oyiga nechta shunday mashina?</li>
<li>Hozir reduktor yoki DHT ga nima quyasiz? Qayerdan olasiz?</li>
<li>Nima quyishni qanday aniqlaysiz?</li>
<li>Shikoyatlar boʻlganmi: shovqin, siltanish, qizib ketish, qaytarishlar?</li>
<li>Sizda skaner, koʻtargich, oʻqitilgan usta bormi?</li>
</ol>
<p>Javoblar ehtiyojni koʻrsatadi. Agar 4-savolga «koʻz bilan» yoki «hamma qatori» deb javob berishsa, bu xavflar haqida suhbatga toʻgʻridan-toʻgʻri kirish.</p>

<h3><span class="sec">11.3</span>Eʼtirozlar va javoblar</h3>
<div class="tbl"><table>
<tr><th>Eʼtiroz</th><th>Javob</th></tr>
<tr><td>«Elektromobilda moy almashtirilmaydi»</td><td>Koʻp ishlab chiqaruvchilar almashtirishni belgilaydi, baʼzi modellarda obkatkadan keyin ham. Moy haroratdan eskiradi va yeyilish mahsulotlarini yigʻadi. Keling, modelingiz qoʻllanmasini ochamiz.</td></tr>
<tr><td>«Istalgan ATF quyamiz — hammasi joyida»</td><td>Baʼzi yuritmalar haqiqatan ATF turida ishlaydi, lekin aniq spetsifikatsiya boʻyicha. «Hoʻl» motorlarda mis va elektr muhim, oddiy ATF da esa ular tekshirilmaydi. Muammolar darhol koʻrinmaydi.</td></tr>
<tr><td>«Qimmat»</td><td>Hisoblaylik: 2 litr suyuqlik va minglab dollarlik yuritma taʼmiri. Bitta almashtirishdagi moy narxi farqi bitta evakuator chaqiruvidan kam.</td></tr>
<tr><td>«Biz original olamiz»</td><td>Original suyuqlikni topish koʻpincha qiyin, qalbakilari ham boʻladi. Tasdiqlangan muvofiqlik va hujjatlarga ega mahsulotni taklif qilaman.</td></tr>
<tr><td>«Talab yoʻq»</td><td>Hududingizda nechta EV va gibrid borligini, ulardan nechtasi taksi ekanini hisoblaylik. Ularga birinchi boʻlib toʻgʻri xizmat koʻrsata boshlagan kishi bu mijozlarni oladi.</td></tr>
</table></div>
<div class="note warn"><span class="tag">Halollik qoidasi</span><p>Agar aniq model uchun tasdiqlangan muvofiqlikka ega suyuqligimiz boʻlmasa, <strong>shunday deymiz</strong>. «Taxminan» sotmaymiz. Yuritmaning bitta buzilishi servisning butun mahsulot qatoriga ishonchini yoʻq qiladi.</p></div>

<h3><span class="sec">11.4</span>Dialog namunasi</h3>
<div class="note">
<p><strong>Agent:</strong> Assalomu alaykum! Sizga elektromobil va gibridlar koʻp keladimi? Ularning reduktoriga qanday moy quyyapsiz?</p>
<p><strong>Usta:</strong> Oddiy transmissiya moyini quyamiz.</p>
<p><strong>Agent:</strong> Koʻp yangi elektromobillarda shu moy elektr motorni ham sovutadi va mis chulgʻamlarga tegadi. Oddiy GL-5 moyidagi oltingugurtli qoʻshimchalar misni yemiradi. Shuning uchun ishlab chiqaruvchining talabiga mos maxsus moy kerak. Keling, sizga koʻp keladigan modellarni koʻrib chiqamiz, men toʻgʻri moyni tanlab beraman.</p>
</div>

<h3><span class="sec">11.5</span>MITAL nimani taklif qila oladi</h3>
<p>Avval narxlar roʻyxati va yetkazib beruvchidan aniqlang: Mitanol va Liman OIL da EV yuritmalari va DHT uchun suyuqliklar bormi va qanday muvofiqlik darajasi bilan (ruxsatnoma, «mos keladi» yoki «tavsiya etiladi»).</p>
<div class="tbl"><table>
<tr><th>Hozir</th><th>EV qatorini chiqarish rejasi</th></tr>
<tr><td>
<ul class="list">
<li>Ishlab chiqaruvchi ruxsatnomalari boʻyicha gibridlar uchun motor moylari</li>
<li>Spetsifikatsiyasi mos keladigan gibridlar va yuritmalar uchun ATF</li>
<li>Gibridlar uchun ECO FILTER filtrlari</li>
<li>Maslahat va tanlash — raqobatchilardan farq sifatida</li>
</ul></td>
<td>
<ol class="list">
<li>Talabni baholash: hududdagi 20–30 servis va taksi parkini soʻrovdan oʻtkazish</li>
<li>Keng qamrovli 1–2 suyuqlikni tanlash va qoʻllanilish roʻyxatlarini tekshirish</li>
<li>Ommabop modellar boʻyicha tanlash jadvalini tuzish</li>
<li>Agentlarni oʻqitish (shu kurs)</li>
<li>Pilot: 3–5 servis va bitta taksi parki</li>
<li>Fikr-mulohaza yigʻish va kengaytirish</li>
</ol></td></tr>
</table></div>
<div class="note biz"><span class="tag">Asosiy imkoniyat</span><p>Eng ommaviy yangi BYD lar (Seal, Sealion 7, Atto 3 EVO, Seagull) W5 sinfidagi bitta moydan (KV100 ≈ 4,3) foydalanadi — har bir reduktorga 0,55–1,8 l. BYD uchun yozma tasdiqli shu sinfdagi moy hududdagi BYD larning katta qismini qamrab oladi. Ikkinchi ommaviy pozitsiya — DM-i gibridlari uchun 0W-20 (ACEA C5) motor moyi.</p></div>
`,quiz:[
{q:"STO bilan uchrashuvni nimadan boshlagan maʼqul?",o:["Darhol narxni aytish","Mashinalar oqimi va hozir nima quyilayotgani haqida savollar berish","Kompaniya tarixini aytib berish"],a:1,w:"Savollar ehtiyoj va xavflarni koʻrsatadi, keyin suhbat ular atrofida quriladi."},
{q:"«EV da moy almashtirilmaydi» degan gapga eng yaxshi javob:",o:["«Ha, haqsiz»","Qoʻllanma talablarini koʻrsatish va eskirish hamda yeyilish mahsulotlari haqida tushuntirish","«Har 5 000 km da almashtiring»"],a:1,w:"Model hujjatlariga tayanamiz. Bu har qanday fikrdan kuchliroq."},
{q:"Mijoz modeli uchun tasdiqlangan muvofiqlikka ega suyuqligimiz yoʻq. Nima qilish kerak?",o:["«Oʻxshashini» taklif qilish","Halol aytish va taxminan sotmaslik","75W-90 taklif qilish"],a:1,w:"Servisning ishonchi bitta savdodan qimmatroq."},
{q:"Gibrid egalariga MITAL ning qaysi mahsulotini eng tez sotish mumkin?",o:["Ishlab chiqaruvchi ruxsatnomasidagi motor moyi","Yuk mashinalari koʻprigi moyi","Gidravlik moy"],a:0,w:"Har bir gibridda dvigatel bor va unga moy muntazam kerak."},
{q:"«Qimmat» degan gapga qanday javob berish kerak?",o:["Darhol chegirma berish","Moy narxini yuritma taʼmiri narxi bilan solishtirish","Ketish"],a:1,w:"Bir necha litr va minglab dollarlik taʼmir — farq aniq."}

function bindCatalog(){
  var bar=document.getElementById("flt"); if(!bar) return;
  bar.addEventListener("click",function(ev){
    var b=ev.target.closest("button"); if(!b) return;
    var k=b.dataset.k;
    bar.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});
    var shown=0;
    document.querySelectorAll("tr.crow").forEach(function(r){
      var ok=(k==="all")||(" "+r.dataset.t+" ").indexOf(" "+k+" ")>=0;
      r.hidden=!ok; if(ok) shown++;
    });
    document.getElementById("fcount").textContent=(bar.dataset.label||"Koʻrsatilgan moylar: ")+shown;
  });
}

  '<li>Internetdagi xitoy maqolalari koʻpchilik toifalar uchun yagona standart yoʻqligini va har bir avtomobil ishlab chiqaruvchisi oʻz korxona standartidan (企标) foydalanishini yozadi. Bu marketing maqolalarining soʻzlari, lekin ular modellar boʻyicha koʻrayotganimizga mos keladi.</li>'+
  '</ul>'+
  '<div class="note warn"><span class="tag">Bu raqamlardan foydalanmang</span><p>Bitta maqolada «hajmiy qarshilik 1×10⁹ Om·sm dan katta» va «oʻtkazuvchanlik 500 pSm/m dan kam» uchraydi. Manba marketing, raqamlarni tekshirib boʻlmadi. Kursda ulardan foydalanib boʻlmaydi.</p></div>'+

  '<h3>5. Almashtirish intervallari (2026-yilgi xitoy maqolasiga koʻra)</h3>'+
  '<div class="tbl models"><table><tr><th>Marka</th><th>Nima deyilgan</th><th>Ishonchlilik</th></tr>'+
  '<tr><td><strong>BYD (toza elektr)</strong></td><td>Reduktor moyi: birinchi almashtirish <strong>24 oy yoki 40 000 km</strong> dan keyin, keyin har <strong>48 oy yoki 80 000 km</strong> da. Elektr yuritma xizmatiga motorni tekshirish, reduktor moyini almashtirish va sovutish tizimini tekshirish kiradi. «Uch elektr uzel»ga kafolat rasmiy dilerlarda xizmatni talab qiladi</td><td><span class="lvl b">OAV dagi qayta bayon</span> <span class="lvl c">qoʻllanma boʻyicha tekshirish</span></td></tr>'+
  '<tr><td><strong>Tesla</strong></td><td>Oʻsha maqolada uchta elektr uzelga xizmat «xizmatsiz» deyilgan, muntazam koʻrikdan oʻtkazish tavsiyasi bilan. Bu Tesla servis qoʻllanmasiga mos kelmaydi, unda toʻkish va quyish tartiblari bor</td><td><span class="lvl c">Bahsli</span></td></tr>'+
  '</table></div>'+
  '<p class="small">Manba: '+A+'https://www.zhihu.com/tardis/jm/art/2012461462375916549">Zhihu dagi maqola</a>. Tekshiruvda sahifa boʻsh ochildi, maʼlumotlar qidiruv tavsifidan olingan.</p>'+
  '<div class="note warn"><span class="tag">Rasmiy qoʻllanmalar bilan solishtirish</span><p>BYD ning yevropa qoʻllanmalari boshqa intervallarni beradi: Seal va Dolphin — birinchi almashtirish 24 oy / 30 000 km dan keyin, keyin har 24 oy / 48 000 km da; Atto 3 EVO — 24 oy / 20 000 km, keyin 24 oy / 30 000 km, filtr bilan birga. Maqolaga emas, mashinangiz qoʻllanmasiga ishoning.</p></div>'+

  '<h3>6. BYD va DM-i uchun motor moyi</h3>'+
  '<p>2025-yil dekabrda BYD Mobil bilan birgalikda DM-i gibrid tizimi uchun 0W-20 motor moyini chiqardi. Yeyilishga chidamlilik tarmoq standartidan 50% yuqori deb daʼvo qilingan. Bu reduktor moyi emas, motor moyi. MITAL uchun bu signal: BYD ning firma qatori bor va u gibridlar servisida mustaqil yetkazib beruvchilar bilan raqobatlashadi. '+A+'https://carnewschina.com/2025/12/23/byd-launched-phev-engine-oil-for-its-dm-i-hybrid-system-in-partnership-with-mobil">CarNewsChina</a></p>'+

  '<h3>7. Qidiruv uchun xitoycha atamalar lugʻati</h3>'+
  '<div class="tbl models"><table><tr><th>Xitoycha</th><th>Oʻzbekcha</th></tr>'+
  '<tr><td>减速箱油 / 减速器油</td><td>reduktor moyi</td></tr>'+
  '<tr><td>电驱油 / 电驱动液</td><td>elektr yuritma moyi / suyuqligi</td></tr>'+
  '<tr><td>油冷电机 / 水冷电机</td><td>moy bilan / suv bilan sovutiladigan motor</td></tr>'+
  '<tr><td>纯电动汽车减速箱用油</td><td>toza elektr avtomobillar reduktorlari uchun moy (standart nomi)</td></tr>'+
  '<tr><td>铜片腐蚀</td><td>mis plastinka korroziyasi (ASTM D130)</td></tr>'+
  '<tr><td>体积电阻率</td><td>solishtirma hajmiy qarshilik</td></tr>'+
  '<tr><td>击穿电压</td><td>teshilish kuchlanishi</td></tr>'+
  '<tr><td>企标</td><td>korxona standarti (avtomobil ishlab chiqaruvchisining ichki standarti)</td></tr>'+
  '<tr><td>原厂 / 加注量 / 更换周期</td><td>original / quyish hajmi / almashtirish intervali</td></tr>'+
  '</table></div>'+

  '<h3>8. Keyin nima qilish kerak</h3>'+
  '<ol class="list">'+
  '<li>NB/SH/T 6042-2021 standartining inglizcha tarjimasini sotib olish va xossalar jadvallarini u bilan solishtirish. Bu ikkala turdagi moylar uchun chegaralari bor yagona ommaviy hujjat.</li>'+
  '<li>BYD va Chery ning Oʻzbekistondagi rasmiy distribyutoridan oʻzbek, rus yoki ingliz tilidagi servis hujjatlarini soʻrash: suyuqlik nomlari va hajmlar.</li>'+
  '<li>Mitanol va Liman OIL yetkazib beruvchisidan NB/SH/T 6042 ga (1- yoki 2-jadval) mos suyuqliklar bormi va elektr maʼlumotlari bilan texnik kartani soʻrash.</li>'+
  '</ol></div>';
}

function lesson(l,idx){
  var h='<div class="page"><p class="eyebrow">'+(l.final?"Yakun":(modOf(l.id)+" · "+(idx+1)+"-dars, jami "+(L.length-1)))+'</p><h2>'+esc(l.title)+'</h2>'+
    '<div class="meta"><span><b>'+l.min+'</b> daqiqa</span><span><b>'+l.quiz.length+'</b> savol</span>'+(S.done[l.id]!=null?'<span>Eng yaxshi natija: <b>'+S.done[l.id]+' / '+l.quiz.length+'</b></span>':'')+'</div>'+
    l.body+
    '<section class="quiz" id="quiz"><div class="quiz-head"><h2>'+(l.final?"Savollar":"Oʻzingizni tekshiring")+'</h2><span id="qscore">0 / '+l.quiz.length+'</span></div>'+
    l.quiz.map(function(q,qi){
      return '<div class="q" data-q="'+qi+'"><p class="q-t"><span class="num">'+(qi+1)+'.</span><span>'+esc(q.q)+'</span></p><div class="opts">'+
      q.o.map(function(o,oi){return '<button class="opt" id="'+l.id+'-q'+qi+'-o'+oi+'" data-o="'+oi+'">'+esc(o)+'</button>'}).join("")+
      '</div><p class="why" hidden></p></div>';
    }).join("")+
    '<div id="qres"></div></section>';
  var prev=L[idx-1], next=L[idx+1];
  h+='<nav class="pager">'+(prev?'<a href="#'+prev.id+'"><small>Orqaga</small>'+esc(prev.title)+'</a>':'<a href="#home"><small>Orqaga</small>Kurs haqida</a>')+
     (next?'<a class="next" href="#'+next.id+'"><small>Keyingi</small>'+esc(next.title)+'</a>':'<a class="next" href="#permodel"><small>Keyingi</small>Modellar boʻyicha moy tanlash</a>')+'</nav></div>';
  return h;
}

function bindQuiz(l){
  var ans={}, right=0;
  var box=document.getElementById("quiz");
  box.addEventListener("click",function(ev){
    var b=ev.target.closest(".opt"); if(!b||b.disabled) return;
    var qd=b.closest(".q"), qi=+qd.dataset.q, oi=+b.dataset.o, q=l.quiz[qi];
    if(ans[qi]!=null) return;
    ans[qi]=oi;
    qd.querySelectorAll(".opt").forEach(function(x,i){x.disabled=true; if(i===q.a) x.classList.add("ok"); else if(i===oi) x.classList.add("no");});
    var w=qd.querySelector(".why"); w.textContent=q.w; w.hidden=false;
    if(oi===q.a) right++;
    document.getElementById("qscore").textContent=right+" / "+l.quiz.length;
    if(Object.keys(ans).length===l.quiz.length) finish(l,right);
  });
}

function finish(l,right){
  var tot=l.quiz.length, res=document.getElementById("qres");
  var best=Math.max(right,S.done[l.id]||0);
  var need=Math.ceil(tot*0.8); var pass = l.final ? right>=need : true;
  if(pass){ S.done[l.id]=best; save(); renderNav(l.id); }
  var idx=L.indexOf(l), next=L[idx+1];
  if(!l.final){
    var ok=right/tot>=0.8;
    res.innerHTML='<div class="result'+(ok?"":" fail")+'"><b>'+right+' / '+tot+'</b><p>'+(ok?"Aʼlo, dars oʻtildi. Keyingisiga oʻtish mumkin.":"Dars belgilandi, lekin xato boʻlgan boʻlimlarni qayta oʻqib, testni yana topshirish kerak.")+'</p>'+
      '<div class="row"><button class="btn ghost" id="retry">Testni qayta topshirish</button>'+(next?'<a class="btn" href="#'+next.id+'">Keyingi dars</a>':'')+'</div></div>';
  } else if(pass){
    res.innerHTML='<div class="cert"><p class="eyebrow">OilBook taʼlimi · Bonus dars</p><h3>Kurs tugatildi</h3><p>«Elektromobil va gibrid reduktorlari uchun moylar» · natija <strong>'+right+' / '+tot+'</strong></p>'+
      '<p><label for="certName" class="small">Belgi uchun ism</label><br><input id="certName" value="'+esc(S.name)+'" placeholder="Ism va familiya"></p>'+
      '<p class="small" id="certLine">'+(S.name?esc(S.name)+' · ':'')+new Date().toLocaleDateString("ru-RU")+'</p>'+
      '<div class="row" style="justify-content:center"><button class="btn ghost" id="retry">Qayta topshirish</button></div></div>';
    var inp=document.getElementById("certName");
    inp.addEventListener("input",function(){S.name=inp.value.trim();save();document.getElementById("certLine").textContent=(S.name?S.name+" · ":"")+new Date().toLocaleDateString("ru-RU")});
  } else {
    res.innerHTML='<div class="result fail"><b>'+right+' / '+tot+'</b><p>Kamida '+need+' ta toʻgʻri javob kerak. Javoblar izohida qaysi darsni takrorlash kerakligi koʻrsatilgan.</p><div class="row"><button class="btn" id="retry">Qayta topshirish</button></div></div>';
  }
  document.getElementById("retry").addEventListener("click",function(){route(true)});
}

function route(toQuiz){
  var id=(location.hash||"#home").slice(1);
  var alias={models:"permodel",popular:"permodel",summary:"permodel",types:"l7"};
  if(alias[id]) id=alias[id];
  var idx=L.findIndex(function(l){return l.id===id});
  var PAGES={glossary:glossary,china:china,catalog:catalog,makers:makers,permodel:permodel};
  if(PAGES[id]){main.innerHTML=PAGES[id](); if(id==="catalog"||id==="permodel") bindCatalog();}
  else if(idx>=0){main.innerHTML=lesson(L[idx],idx);bindQuiz(L[idx]);}
  else {id="home";main.innerHTML=home();}
  renderNav(id);
  side.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");
  if(toQuiz===true){var qz=document.getElementById("quiz"); if(qz) qz.scrollIntoView();}
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){route(false)});
route(false);
</script>
