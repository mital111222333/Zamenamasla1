<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нет соединения</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #F1F5F9; color: #0A2540; font-family: -apple-system, sans-serif; text-align: center; padding: 24px;
  }
  .box { max-width: 320px; }
  .icon { font-size: 48px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #64748B; font-size: 14px; line-height: 1.5; }
  button {
    margin-top: 18px; background: #0A2540; color: #fff; border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>Нет соединения с интернетом</h1>
    <p>Эта платформа работает с живыми данными и не сохраняет их для просмотра офлайн. Подключитесь к интернету и попробуйте снова.</p>
    <button onclick="location.reload()">Обновить</button>
  </div>
</body>
</html>
